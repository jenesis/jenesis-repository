name: Release jenesis-repository

# Releases are dispatched by hand from the Actions tab, so any commit is releasable:
# the sha input picks the commit (the head this runs on by default) and the tag input
# picks the tag (the next minor of the latest tag by default). Staging re-runs the build with strict
# dependency pinning, which writes the command-line client's launcher; JReleaser then signs the release's files,
# cuts the GitHub release + tag and publishes the client to Homebrew and Scoop. No module is deployed to Maven
# Central.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to release; defaults to the head this workflow runs on
        required: false
        type: string
      tag:
        description: Tag to cut, vX.Y.Z; defaults to the next minor of the latest tag
        required: false
        type: string

# Route Maven Central through the repository variable MAVEN_REPOSITORY_URI when set
# (a mirror, to avoid Central rate-limiting the runners), falling back to Central
# itself so an unset variable never becomes an empty URI.
env:
  MAVEN_REPOSITORY_URI: ${{ vars.MAVEN_REPOSITORY_URI || 'https://repo1.maven.org/maven2/' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.sha || github.sha }}
          # build/jenesis is a symlink into the build/.upstream submodule (the pinned jenesis build tool).
          submodules: true

      - name: Resolve release version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            VERSION="$(printf '%s' "$TAG" | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
            if [ -z "$VERSION" ]; then
              echo "Tag '$TAG' is not a release tag: pass vX.Y.Z or X.Y.Z, e.g. v1.2.3." >&2
              exit 1
            fi
          else
            LATEST="$(git tag --list --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 | sed 's/^v//')"
            if [ -z "$LATEST" ]; then
              VERSION="0.0.1"
            else
              MAJOR="$(echo "$LATEST" | cut -d. -f1)"
              MINOR="$(echo "$LATEST" | cut -d. -f2)"
              VERSION="${MAJOR}.$((MINOR + 1)).0"
            fi
          fi
          echo "Releasing $VERSION as tag v$VERSION from $(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and stage artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Every archive entry carries the released commit's time rather than the runner's clock, so the same
          # commit builds the same archives.
          java -Djenesis.project.version=${VERSION} \
               -Djenesis.archive.timestamp="$(git log -1 --format=%cI)" \
               -Djenesis.dependency.pin=strict \
               build/jenesis/Make.java stage

      # The command-line client ships as its launcher jar and as the archive around it that Homebrew, Scoop and mise
      # install: bin/ from sdk/, the jar the launcher packaging wrote, and the licence. The archive is unpacked and run
      # before anything is released.
      - name: Package the command-line client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LAUNCHER="$(find target/build -path '*source+cli/package/launcher/bundle/output/launcher/build.jenesis.repository.cli.jar' | head -1)"
          if [ -z "${LAUNCHER}" ]; then
            echo "The staged build wrote no launcher for the cli module." >&2
            exit 1
          fi
          git clean -fdX sdk/
          BASE="jenrepo-${VERSION}"
          mkdir -p "sdk/${BASE}/lib"
          cp -r sdk/bin "sdk/${BASE}/bin"
          cp "${LAUNCHER}" "sdk/${BASE}/lib/jenrepo.jar"
          cp LICENSE NOTICE "sdk/${BASE}/"
          cp "${LAUNCHER}" "sdk/${BASE}.jar"
          (cd sdk && zip -r "${BASE}.zip" "${BASE}")
          rm -rf "sdk/${BASE}"
          UNPACKED="$(mktemp -d)"
          unzip -q "sdk/${BASE}.zip" -d "${UNPACKED}"
          cp -r sdk/tests "${UNPACKED}/${BASE}/tests"
          "${UNPACKED}/${BASE}/tests/test.sh"

      - name: JReleaser deploy
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: latest
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_REPRODUCIBLE: "true"
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          JRELEASER_SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}

      # SDKMAN waits until the jenrepo candidate exists there: then uncomment this step and set the SDKMAN_EMAIL and
      # SDKMAN_PASSWORD secrets.
      # - name: Publish the SDKMAN candidate
      #   env:
      #     VERSION: ${{ steps.version.outputs.version }}
      #     EMAIL: ${{ secrets.SDKMAN_EMAIL }}
      #     PASSWORD: ${{ secrets.SDKMAN_PASSWORD }}
      #   run: |
      #     if [ -z "${EMAIL}" ] || [ -z "${PASSWORD}" ]; then
      #       echo "No SDKMAN credentials: set the SDKMAN_EMAIL and SDKMAN_PASSWORD secrets." >&2
      #       exit 1
      #     fi
      #     TOKEN="$(curl -sS --fail-with-body https://state.sdkman.io/login \
      #       -H 'Content-Type: application/json' \
      #       -d "$(jq -n --arg email "${EMAIL}" --arg password "${PASSWORD}" \
      #               '{email: $email, password: $password}')" | jq -r '.token // empty')"
      #     if [ -z "${TOKEN}" ]; then
      #       echo "SDKMAN returned no token for ${EMAIL}." >&2
      #       exit 1
      #     fi
      #     echo "::add-mask::${TOKEN}"
      #     DOWNLOAD="https://github.com/jenesis/jenesis-repository/releases/download/v${VERSION}/jenrepo-${VERSION}.zip"
      #     curl -fsIL -o /dev/null "${DOWNLOAD}"
      #     curl -sS --fail-with-body -X POST https://state.sdkman.io/versions \
      #       -H "Authorization: Bearer ${TOKEN}" \
      #       -H 'Content-Type: application/json' \
      #       -d "$(jq -n \
      #               --arg candidate jenrepo \
      #               --arg version "${VERSION}" \
      #               --arg url "${DOWNLOAD}" \
      #               --arg sha256sum "$(sha256sum "sdk/jenrepo-${VERSION}.zip" | cut -d' ' -f1)" \
      #               '{candidate: $candidate, version: $version, platform: "UNIVERSAL", visible: true,
      #                 url: $url, sha256sum: $sha256sum, tags: ["latest"]}')"

      - name: Publish the jenrepo packslip for mise
        uses: jdx/packslip@74c75db7d611b36dd5a157999ec16cf823ccf80c # v1.2.0
        with:
          project: github.com/jenesis/jenesis-repository/jenrepo
          tag: v${{ steps.version.outputs.version }}
          artifacts: sdk/jenrepo-${{ steps.version.outputs.version }}.zip
          bin: jenrepo
          require: bin:java@25

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
