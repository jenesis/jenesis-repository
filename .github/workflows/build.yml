name: Test jenesis-repository

on:
  push:
    branches: [main]
  pull_request:

# Route Maven Central through the repository variable MAVEN_REPOSITORY_URI when set
# (a mirror, to avoid Central rate-limiting the runners), falling back to Central
# itself so an unset variable never becomes an empty URI.
env:
  MAVEN_REPOSITORY_URI: ${{ vars.MAVEN_REPOSITORY_URI || 'https://repo1.maven.org/maven2/' }}

# One build runs every module and every suite, in one `java build/jenesis/Make.java` invocation. Every suite here runs
# in process against the code it tests - no container, browser, booted server or live network - so the runner needs
# JDK 25 and nothing else, and there is nothing to select or skip by tag. The `ci` profile makes a suite that would
# self-skip for a missing prerequisite fail instead, so a green run means every suite ran.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # build/jenesis is a symlink into the build/.upstream submodule (the pinned jenesis build tool).
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test
        shell: bash
        run: java -Djenesis.make.profiles=ci build/jenesis/Make.java

      - name: Upload target on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target
          path: target/
          retention-days: 3
          if-no-files-found: ignore
