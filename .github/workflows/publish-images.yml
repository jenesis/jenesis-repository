# Build the Jenesis Repository image and its Helm chart and push them to Docker Hub, on demand. Run it from the
# Actions tab (Run workflow) on main with a product version. It runs this repository's images exporter
# (export/custom/images), which builds the image from the staged Docker context - its contents are the bundle
# module's requires closure - packages the chart, and, because the hub profile names a registry, pushes
# jenesis-repository (tagged with the version and latest) and the jenesis chart.
# What the exporter builds and publishes is its values in jenesis.plugins.arguments.properties.
#
# ─────────────────────────────────────────────────────────────────────────────
#  ONE-TIME SETUP
# ─────────────────────────────────────────────────────────────────────────────
#  Configure these under the repo's Settings -> Secrets and variables -> Actions.
#  Non-secret coordinates go under "Variables"; credentials under "Secrets".
#
#  Docker Hub  ->  hub.docker.com
#    Create an access token under Account Settings -> Personal access tokens (Read & Write).
#      Secrets:    DOCKER_HUB_TOKEN
#      Variables:  DOCKER_HUB_USER, DOCKER_HUB_NAMESPACE   (the org or user the repo lives under)
#
#  The cloud registries - Amazon ECR, Azure Container Registry, Google Artifact Registry and Scaleway -
#  are switched off for now: this workflow publishes to Docker Hub alone. The images module still
#  pushes to each (images.push=aws|azure|gcp|scaleway in a profile's jenesis.plugins.arguments-<profile>.properties,
#  with the credentials documented on plugins/images/Push), and the workflow's history holds the one-time setup
#  of each.
#
# ─────────────────────────────────────────────────────────────────────────────
#  AFTER THE IMAGE IS PUSHED:  standing up a server
# ─────────────────────────────────────────────────────────────────────────────
#  The image is the all-in-one server. Deploy it with the chart (deploy/helm/jenesis) pointing the image at a
#  URI this workflow pushed. The server reads JENREG_* environment variables: JENREG_STORE selects the backend
#  (filesystem needs JENREG_FILESYSTEM_ROOT; s3, gcs and azure-blob their bucket or container and a
#  credential), and JENREG_UI_GITHUB_* or JENREG_UI_OIDC_* configure the console's sign-in.

name: Publish the image and chart

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image/product version tag (independent of the Jenesis tool version)
        type: string
        default: "1.0.0"
      push_latest:
        description: Also tag :latest
        type: boolean
        default: true

# The images goal is the build itself, so the runner needs JDK 25 as well as the Docker and helm the hosted image
# preinstalls. Maven Central goes through the repository variable MAVEN_REPOSITORY_URI when set.
env:
  MAVEN_REPOSITORY_URI: ${{ vars.MAVEN_REPOSITORY_URI || 'https://repo1.maven.org/maven2/' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job's OIDC identity is what signs the image and chart keylessly (images.sign=keyless in the hub profile).
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # build/jenesis is a symlink into the build/.upstream submodule (the pinned jenesis build tool).
          submodules: recursive

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      # One invocation builds and publishes: the images goal builds the image from the staged context, packages the
      # chart and, because a target is named, pushes both. Built here rather than assumed, so a publish can never
      # push an image from a previous checkout. An unset credential makes the push refuse by name, which is the
      # message an operator needs.
      - name: Publish
        shell: bash
        env:
          PUSH_VERSION: ${{ inputs.version }}
          PUSH_LATEST: ${{ inputs.push_latest && '1' || '0' }}
          DOCKER_HUB_USER: ${{ vars.DOCKER_HUB_USER }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_NAMESPACE: ${{ vars.DOCKER_HUB_NAMESPACE }}
        run: java -Djenesis.test.skip=true -Djenesis.make.profiles=hub build/jenesis/Make.java export/custom/images
