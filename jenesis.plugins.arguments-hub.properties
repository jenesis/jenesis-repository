# Publishes the image and chart to Docker Hub: java -Djenesis.make.profiles=hub build/jenesis/Make.java
# export/custom/images, with DOCKER_HUB_USER, DOCKER_HUB_TOKEN, DOCKER_HUB_NAMESPACE and PUSH_VERSION set. A profile
# of the same shape publishes elsewhere - images.push=aws, azure, gcp, scaleway or all, several comma-separated - with
# the credentials plugins/images/build/jenesis/images/Push.java documents.
images.push=hub
# Every pushed image and chart is signed by the digest the registry holds, keylessly with the publishing job's own
# identity, and each image carries its SBOM as an attestation - verified with the cosign command core/README.md gives.
images.sign=keyless
