project:
  name: jenesis-repository
  description: A dual-layout artifact repository serving the Maven layout, the Jenesis module layout and OCI from one content-addressed store.
  authors: [Rafael Winterhalter]
  license: Apache-2.0
  links:
    homepage: https://github.com/jenesis/jenesis-repository
  languages:
    java:
      groupId: build.jenesis
      artifactId: build.jenesis.repository
      version: '25'

signing:
  active: ALWAYS
  pgp:
    armored: true
    mode: MEMORY

release:
  github:
    owner: jenesis
    name: jenesis-repository
    branch: main
    branchPush: main
    skipRelease: false
    skipTag: false
    tagName: 'v{{projectVersion}}'

# The command-line client: its launcher jar as a download of its own, and the SDKMAN archive that wraps it with the
# jenesis-repo command. Both are assembled by release.yml after staging; SDKMAN itself is published from release.yml
# against state.sdkman.io, since JReleaser speaks only SDKMAN's retired vendor API.
distributions:
  jenesis-repo:
    type: JAVA_BINARY
    executable:
      name: jenesis-repo
    java:
      mainClass: build.jenesis.repository.cli.Cli
    artifacts:
      - path: 'sdk/jenesis-repo-{{projectVersion}}.zip'

files:
  artifacts:
    - path: 'sdk/jenesis-repo-{{projectVersion}}.jar'

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        stagingRepositories:
          - target/stage/maven/output
