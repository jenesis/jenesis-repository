project:
  name: jenesis-repository
  description: A dual-layout artifact repository serving the Maven layout, the Jenesis module layout and OCI from one content-addressed store.
  authors: [Rafael Winterhalter]
  license: Apache-2.0
  copyright: 2026 Rafael Winterhalter
  links:
    homepage: https://github.com/jenesis/jenesis-repository
  languages:
    java:
      groupId: build.jenesis
      artifactId: build.jenesis.repository
      version: '25'

signing:
  active: ALWAYS
  pgp:
    armored: true
    mode: MEMORY

release:
  github:
    owner: jenesis
    name: jenesis-repository
    branch: main
    branchPush: main
    skipRelease: false
    skipTag: false
    tagName: 'v{{projectVersion}}'

# The command-line client: its launcher jar as a download of its own, and the archive that wraps it with the jenrepo
# command, published to Homebrew and Scoop here and to mise from release.yml. Both are assembled by release.yml after
# staging. The packager templates live under distribution/, since this project has no src/ tree for JReleaser's
# default location, so each packager names its templateDirectory.
distributions:
  jenrepo:
    type: JAVA_BINARY
    executable:
      name: jenrepo
    java:
      mainClass: build.jenesis.repository.cli.Cli
    artifacts:
      - path: 'sdk/jenrepo-{{projectVersion}}.zip'
    brew:
      active: ALWAYS
      templateDirectory: distribution/jenrepo/brew
      formulaName: jenrepo
      repository:
        owner: jenesis
        name: homebrew-tap
    scoop:
      active: ALWAYS
      templateDirectory: distribution/jenrepo/scoop
      packageName: jenrepo
      repository:
        owner: jenesis
        name: scoop-bucket
    # SDKMAN is published from release.yml against state.sdkman.io once the candidate exists, since JReleaser speaks
    # only SDKMAN's retired vendor API; the step there is commented out until then.

checksum:
  individual: true

# Every staged module's jar and POM is a release asset of its own, which is where jenesis.build's discovery file sends a
# build resolving build.jenesis.repository.*, each beside its signature. A release holds at most 1,000 assets, so the
# modules carry no checksum file: a resolving build verifies the signature and the SHA-256 its own pins record. The
# client keeps its checksums, which Scoop's autoupdate reads.
files:
  artifacts:
    - path: 'sdk/jenrepo-{{projectVersion}}.jar'
  globs:
    - pattern: '**/*-{{projectVersion}}.{jar,pom}'
      directory: 'target/stage/maven/output'
      extraProperties:
        skipChecksum: true
