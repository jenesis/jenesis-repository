# The image and chart this repository publishes. A releaser of the whole project: it runs with `release`, where
# build.jenesis/plugin-images.properties holds its values, and is handed everything `stage` wrote, the Docker context
# of source/bundle among it, so
#
#   java build/jenesis/Make.java release/custom/plugin.images                    builds the image and the chart
#   java -Djenesis.make.profiles=hub -Djenesis.release.publish=true \
#        build/jenesis/Make.java release/custom/plugin.images                    ... and publishes both
#
# Naming release/custom/plugin.images runs it alone, without the stock steps of the release. plugins/README.md says
# what it does.
images+release=./plugins/images
