# The image and chart this repository publishes. An exporter of the whole project: it runs with `export` and is
# handed everything `stage` wrote, the Docker context of source/bundle among it, so
#
#   java build/jenesis/Make.java export/custom/images                              builds the image and the chart
#   java -Djenesis.make.profiles=hub build/jenesis/Make.java export/custom/images  ... and publishes both
#
# Naming export/custom/images runs it alone, without the stock export into the local repositories. Its values are in
# jenesis.plugins.arguments.properties, and plugins/README.md says what it does.
images+export=./plugins/images
