apiVersion: v2
name: jenesis
description: |
  Jenesis Repository - a content-addressed artifact repository with a web console on one stateless process.
  Deploys the all-in-one repository image: every SPI implementation aboard, trimmed at runtime by
  configuration (JENREG_* keys) instead of rebuilt. No database; state is the object store (a
  PersistentVolume, S3, GCS or Azure Blob). Packaging names the chart and points it at the image
  repository it deploys, so one source serves every image built from this product.
type: application
version: 0.3.0
# The image tag the chart deploys when image.tag is left empty. Packaging points image.repository at the
# published repository of the image it is packaged for; a chart installed straight out of this directory
# deploys jenesis-repository.
appVersion: "latest"
keywords:
  - artifact-repository
  - maven
  - npm
  - docker
home: https://github.com/jenesis/jenesis-repository
sources:
  - https://github.com/jenesis/jenesis-repository
# Artifact Hub reads these off the packaged chart; it indexes rather than hosts, so what it shows of
# a chart is whatever the chart says about itself.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/jenesis/jenesis-repository
