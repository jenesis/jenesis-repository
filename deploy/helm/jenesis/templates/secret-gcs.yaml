{{- /*
The gcs backend's service-account key, when one is given. It is a file to the backend (JENREG_GCS_CREDENTIALS
names its path), not a variable, so it lives in its own Secret and is mounted rather than exported into the
environment beside the other credentials - envFrom would otherwise hand the whole key to every process in the
container as a variable.
*/ -}}
{{- if and (eq .Values.store.backend "gcs") .Values.secrets.gcsServiceAccountKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jenreg.fullname" . }}-gcs
  labels:
    {{- include "jenreg.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials.json: {{ .Values.secrets.gcsServiceAccountKey | quote }}
{{- end }}
