{{- /*
  The master key stored secret settings are sealed with (JENREPO_SECRETS_KEY), generated once and kept: without it a
  secret setting is refused rather than stored, and losing it makes every stored secret unreadable. So it is created on
  install, carried over unchanged on every upgrade, and left behind on uninstall. A key given through
  secrets.existingSecret takes precedence, since that Secret is read after this one.
*/ -}}
{{- if .Values.secrets.generateSettingsKey }}
{{- $name := printf "%s-settings-key" (include "jenrepo.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "jenrepo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "JENREPO_SECRETS_KEY") }}
  JENREPO_SECRETS_KEY: {{ index $existing.data "JENREPO_SECRETS_KEY" }}
  {{- else }}
  JENREPO_SECRETS_KEY: {{ printf "k1:%s" (randBytes 32) | b64enc }}
  {{- end }}
{{- end }}
