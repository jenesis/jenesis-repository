# The values of the images releaser, which jenesis.plugins.properties names; this file's presence is what runs it.
#
# image.<module path>=<repository>   the image a module's staged Docker context is built as; built locally as
#                                    <repository>:latest and published as <registry>/<repository>, tagged with the
#                                    version and latest
# chart.<name>=<input>/<path>        a Helm chart packaged from the chart source at a path of a bound input
# chart.<name>.image=<repository>    the image the packaged chart runs by default
# @<input>/sources=<folder>          a folder of this repository bound as an input the steps read
# push=<registries>                  where to publish; set by a profile, see hub/plugin-images.properties
image.source/bundle=jenesis-repository
chart.jenesis=deploy/helm/jenesis
chart.jenesis.image=jenesis-repository
@deploy/sources=deploy
