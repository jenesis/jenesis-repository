# The tenant a server booted in this JVM serves when a suite names none. The suites address their repositories
# under "default", which the product's own default was until it became "releases": naming it here keeps every
# in-process boot where the suites expect it, and the shipped default is held by the suites that assert it by name
# (DefaultTenantDefaultTest and MintKeyTest). A suite naming its own tenant still wins, and one that sets the
# property restores it rather than clearing it.
#
# A profile's process-test.properties REPLACES this file rather than adding to it, so every profile file repeats
# this line; a profile without it boots its servers on the product's default, and its suites answer 404.
-Djenreg.default-tenant\=default
