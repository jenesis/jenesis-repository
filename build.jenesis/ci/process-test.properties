# Selected by -Djenesis.make.profiles=ci (the CI full-suite runs): prepends the bare
# flag below to the forked test JVM, where Requirement.requireOrSkip turns an unmet
# tool/network gate into a test FAILURE instead of a silent self-skip - CI installs every
# tool the selected suites need, so a skip there is a broken lane hiding as green.
# Jenesis 0.9.4+ names the test fork's process override "test"; <= 0.9.3 named it "java"
-Djenrepo.test.required

# The suites' tenant, repeated because this file replaces the root one; the reason is written there.
-Djenrepo.default-tenant\=default

# Servers booted in a test JVM write relaxed: a forced flush per write costs ten or more milliseconds on a disk
# without power-loss protection, and a lane writes hundreds of thousands of times. The strict default is held by
# FilesystemDurabilityTest, which reads the provider with nothing set. Repeated in every profile, as the line above.
-Djenrepo.filesystem.durability\=relaxed
