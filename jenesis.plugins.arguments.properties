# The values of the plugins jenesis.plugins.properties names, one line per value as <plugin>.<key>.
#
# images.image.<module path>=<repository>   the image a module's staged Docker context is built as; built locally as
#                                           <repository>:latest and published as <registry>/<repository>, tagged
#                                           with the version and latest
# images.chart.<name>=<input>/<path>        a Helm chart packaged from the chart source at a path of a bound input
# images.chart.<name>.image=<repository>    the image the packaged chart runs by default
# images.@<input>/sources=<folder>          a folder of this repository bound as an input the steps read
# images.push=<registries>                  where to publish; set by a profile, see jenesis.plugins.arguments-hub
images.image.source/bundle=jenesis-repository
images.chart.jenesis=deploy/helm/jenesis
images.chart.jenesis.image=jenesis-repository
images.@deploy/sources=deploy
