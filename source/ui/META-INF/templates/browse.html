<!doctype html>
<!--
  browse.html — the generic artifact browse: a breadcrumbed, lazy tree over the repository's published namespace.

  Rendered by BrowseController against the ArtifactStore listing seam. Every level lists only its immediate children;
  a folder's children are fetched on demand (the `rows` fragment, served by /browse/children and swapped in by htmx on
  expand, or reached by navigating into the folder), so the browse never scans or buffers a whole tree.

  The tree body itself is `base :: browseRows`, shared with the repository-scoped browse the admin console serves: the
  two drew the same tree in ninety lines of near-identical markup each, and had already drifted. What differs is where
  a row links, and a row carries its own links (BrowseRow).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Browse', 'jenesis-repository')}">
    <meta charset="utf-8">
    <title>Browse · jenesis-repository</title>
</head>
<body>
<!--/* The shared shell, so this screen carries the same nav, tenant chrome, posture badge and sign-out as every
     other. It used to hand-roll a two-item nav of its own, which is how a screen stops looking like the console
     it is part of. */-->
<th:block th:replace="~{base :: shell('jenesis-repository', @{/}, 'jenesis-repository', ~{})}"></th:block>
<main id="main" class="container">
    <div th:replace="~{base :: messages}"></div>
    <header th:replace="~{base :: pageHeaderCrumbs('Browse', ${crumbs})}"></header>

    <p>
        <a th:href="@{/assets}" role="button" class="secondary" download="assets.ndjson">Download asset listing (NDJSON) &darr;</a>
    </p>
    <p><small>Every published asset - path, size and SHA-256 - streamed straight from the store. The same walk the
        <code>/api/assets</code> API serves, so getting your data out is never an afterthought.</small></p>

    <!--/* The wide-table containment contract: the table scrolls horizontally inside this figure on a
         narrow viewport, never the page. */-->
    <figure>
    <table class="app-list">
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Type</th>
            <th scope="col" class="app-list__num">Size</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:if="${hasParent}">
            <tr th:replace="~{base :: browseUp(@{/browse(path=${parent})})}"></tr>
        </th:block>
        <!--/* Named so htmx can fetch just this block for a folder's children; it delegates, so the lazy rows and
             the first-level rows are the same rows. */-->
        <th:block th:fragment="rows">
            <th:block th:replace="~{base :: browseRows(${entries}, ${truncated},
                    'Showing the first ' + ${cap} + ' entries in this folder; navigate into a subfolder to see more.')}"></th:block>
        </th:block>
        </tbody>
    </table>
    </figure>

    <!--/* th:if must sit on a wrapping block: on the same element, th:replace (precedence 100) runs BEFORE
         th:if (300), so both empty states would render unconditionally. */-->
    <th:block th:if="${entries.isEmpty() and !hasParent}">
        <div th:replace="~{base :: empty('The repository is empty. Publish an artifact to see it here.')}"></div>
    </th:block>
    <th:block th:if="${entries.isEmpty() and hasParent}">
        <div th:replace="~{base :: empty('This folder is empty.')}"></div>
    </th:block>
</main>
</body>
</html>
