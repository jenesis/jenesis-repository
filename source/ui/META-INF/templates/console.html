<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Console', 'jenesis-repository')}">
    <meta charset="utf-8">
    <title>jenesis-repository</title>
</head>
<body>
<a class="app-skip-link" href="#main">Skip to content</a>
<!--/* The shared console header, with this page's panel anchors passed into its edition slot: while the
     overview is still a single page of cards, its own in-page navigation belongs to it and not to every screen. */-->
<th:block th:replace="~{base :: shell('jenesis-repository', @{/}, 'jenesis-repository', ~{:: panelAnchors})}"></th:block>
<th:block th:fragment="panelAnchors">
    <!--/* A panel that failed to render keeps its entry - it must not read as a panel with nothing to say - and is
         marked here so the failure is visible without scrolling to its card. */-->
    <li th:each="panel : ${panels}">
        <a th:href="'#' + ${panel.id}"
           th:text="${panel.failed} ? ${panel.title} + ' \u26a0' : ${panel.title}">Panel</a>
    </li>
</th:block>
<main id="main" class="container">
    <div th:replace="~{base :: messages}"></div>
    <header th:replace="~{base :: pageHeader('Repository console')}"></header>
    <th:block th:if="${readOnly}">
        <p th:replace="~{base :: alert('This instance is in read-only mode - every write is refused.', 'warn')}"></p>
    </th:block>
    <th:block th:if="${anonymousRights != null and !anonymousRights.isEmpty()}">
        <p th:replace="~{base :: alert('Anonymous access: ' + ${anonymousRights} + ' - keyless callers are granted these rights with no credential.', 'warn')}"></p>
    </th:block>
    <!--/* th:if must sit on a wrapping block: on the same element, th:replace (precedence 100) runs BEFORE
         th:if (300), so the empty state would render unconditionally. */-->
    <th:block th:if="${panels.isEmpty()}">
        <div th:replace="~{base :: empty('No panels are registered.')}"></div>
    </th:block>
    <article th:each="panel : ${panels}" th:id="${panel.id}" class="app-card">
        <header><h2 th:text="${panel.title}">Panel</h2></header>
        <!--/* A contained panel failure renders here in the failed panel's own card: th:text escapes the notice, so
             a failing panel contributes no markup at all, and the body it never produced is not rendered. */-->
        <th:block th:if="${panel.failed}">
            <p th:replace="~{base :: alert(${panel.failure}, 'danger')}"></p>
        </th:block>
        <div th:unless="${panel.failed}" th:utext="${panel.body}">panel body</div>
    </article>
</main>
</body>
</html>
