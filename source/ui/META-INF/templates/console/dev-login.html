<!doctype html>
<!--
  dev-login.html - the development profile's credential form.

  A mechanism owns its own form page and the shared sign-in page links to it; this is that page for the dev profile,
  drawn in the same frame as every other sign-in page.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Sign in', ${product})}">
    <meta charset="utf-8">
    <title>Sign in</title>
</head>
<body>
<th:block th:replace="~{base :: signInShell}"></th:block>
<main id="main" class="app-signin">
    <h1>Sign in</h1>
    <p class="app-signin__lede">With a username and password.</p>
    <th:block th:if="${param.error}">
        <p th:replace="~{base :: alert('Sign-in failed, or your account belongs to no tenant.', 'danger')}"></p>
    </th:block>
    <form method="post" th:action="@{/ui/login/dev}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required/>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required/>
        <button type="submit">Sign in</button>
    </form>
    <p class="app-signin__foot">This form is the <strong>development profile's</strong> sign-in and ships switched
        off. A production deployment signs in through an installed mechanism - single sign-on, or a login key.</p>
    <p class="app-signin__foot"><a th:href="@{/ui/login}">&larr; Back to sign-in options</a></p>
</main>
</body>
</html>
