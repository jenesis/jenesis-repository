<!doctype html>
<!--
  login.html - the sign-in page, for every console.

  It lists what the installed mechanism modules offer (LoginOptions), each button linking into the URL space that
  mechanism owns, and says so plainly when none is installed: a sign-in page with no buttons and no explanation is
  indistinguishable from a broken one. It is drawn in the console's frame without its navigation, as one sheet in the
  middle of the page.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Sign in', ${product})}">
    <meta charset="utf-8">
    <title>Sign in</title>
</head>
<body>
<th:block th:replace="~{base :: signInShell}"></th:block>
<main id="main" class="app-signin">
    <h1>Sign in</h1>
    <p class="app-signin__lede" th:text="${tagline}">The console of the repository server.</p>
    <th:block th:if="${param.error}">
        <p th:replace="~{base :: alert('Sign-in failed, or your account belongs to no tenant.', 'danger')}"></p>
    </th:block>
    <th:block th:if="${param.logout}">
        <p th:replace="~{base :: alert('You have signed out.', 'pass')}"></p>
    </th:block>
    <div th:if="${loginConfigured}" class="app-signin__options">
        <!--/* The mark is inline SVG built from module constants and geometry - never from a name - which is why it
             is the one value here rendered unescaped. A mechanism that ships its own drawing renders that instead;
             the resolution is made in the controller, as it is on every other console surface. */-->
        <a th:each="option : ${loginOptions}" role="button" th:href="@{${option.href()}}">
            <span class="app-mark" th:classappend="${option.markTint()}"
                  th:title="${option.markTitle()}" role="img" th:aria-label="${option.markTitle()}"
                  th:utext="${option.markSvg()}"></span>
            <span th:text="'Sign in with ' + ${option.label()}">Sign in</span>
        </a>
    </div>
    <!--/* Not an error state and not an empty one: a deployment that installed no mechanism cannot be signed into at
         all, and the page says which of the two it is so nobody debugs a missing button. */-->
    <div th:unless="${loginConfigured}">
        <p><strong>No sign-in module is installed or configured.</strong></p>
        <p>Install an authentication module and configure it (see its documentation), then restart to enable
            sign-in.</p>
    </div>
</main>
</body>
</html>
