<!doctype html>
<!--
  base.html — the shared console component set, layered over Pico + app.css.

  These Thymeleaf fragments are the documented component vocabulary every screen composes from: the shell <head>,
  the page header (title + optional breadcrumb + a primary-action slot), the empty state, the status badge and the
  form-field-with-help atom. They are pure presentation — no business logic lives in the shell — so both the free
  repository console and the downstream console (once it requires this module) render one visual language by
  th:replace-ing these fragments rather than re-vendoring a second copy that would drift.

  Fragments provided:
    headContents(title, product)    — everything every page loads; for a console adding its own <head> extras.
    head(title, product)            — the shell <head>: viewport, Pico, app.css, htmx, theme + console scripts,
                                      and the CSRF meta pair where the page has a token. `product` names the
                                      edition in the tab title; both consoles render this one head.
    pageHeader(title)               — a page header with just a title.
    pageHeaderCrumbs(title, crumbs) — a page header with a breadcrumb (crumbs: List<Map{href,label}>, last is current).
    empty(message)                  — the one empty-state treatment.
    field(label, name, value, help) — a labelled text input with inline help text.
    alert(message, kind)            — a flash/outcome banner; kind ∈ {pass,warn,danger} or null for info.
    themeSelect                     — the light/dark/auto switch (wired by /js/theme.js, persisted per browser).
    dangerButton(label, confirm)    — a destructive submit: the danger treatment plus its confirmation, together.

  Kept in sync with app.css (the tokens/styles); each fragment documents itself below.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- The shared <head>, in two shapes for the two ways a console needs it.

     `headContents` is everything every page loads; `head` is that wrapped in a <head> for a console with nothing
     to add. A console that does need something of its own - the enterprise shell has one stylesheet - writes its
     own <head>, includes the contents, and adds its extra, so there is still exactly one list of what a page
     loads. Keeping two whole <head>s in step by hand is what failed before: a script added to one was missing
     from the other until something noticed. -->
<th:block th:fragment="headContents(title, product)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' \u00b7 ' + ${product}">Jenesis</title>
    <link rel="stylesheet" th:href="@{/css/pico.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- Rendered only where a CSRF token exists, so one head serves a console that has one and a page that does not. -->
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <!-- Deliberately not deferred: a stored dark/light choice must apply before the first paint. -->
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/htmx.min.js}" defer></script>
    <script th:src="@{/js/console.js}" defer></script>
</th:block>

<head th:fragment="head(title, product)">
    <th:block th:replace="~{base :: headContents(${title}, ${product})}"></th:block>
</head>

<body>

<!-- Brand: the product logo + name for the top nav. `name` is the product label; `href` is where it links
     (the console home). The logo is served from the shared ui resources, so the downstream console renders
     the same fragment with its own name. -->
<a th:fragment="brand(name, href, logo)" th:href="${href}" class="app-brand">
    <img class="app-brand__mark app-brand__mark--light" th:src="@{|/img/${logo}-light.svg|}" alt="" width="20" height="20">
    <img class="app-brand__mark app-brand__mark--dark" th:src="@{|/img/${logo}-dark.svg|}" alt="" width="20" height="20">
    <strong th:text="${name}">Jenesis</strong>
</a>

<!-- Page header: just a title. A page needing the primary-action slot renders the .app-page-header markup
     directly or uses pageHeaderCrumbs; this fragment stays presentation-only. -->
<header th:fragment="pageHeader(title)" class="app-page-header">
    <hgroup class="app-page-header__heading">
        <h1 class="app-page-header__title" th:text="${title}">Title</h1>
    </hgroup>
</header>

<header th:fragment="pageHeaderCrumbs(title, crumbs)" class="app-page-header">
    <hgroup class="app-page-header__heading">
        <nav th:if="${crumbs != null and !crumbs.isEmpty()}" aria-label="Breadcrumb">
            <ol class="app-breadcrumb">
                <li th:each="crumb, iter : ${crumbs}">
                    <a th:if="${!iter.last and crumb.href != null}" th:href="${crumb.href}" th:text="${crumb.label}">crumb</a>
                    <span th:unless="${!iter.last and crumb.href != null}" th:text="${crumb.label}"
                          th:attr="aria-current=${iter.last} ? 'page' : null">crumb</span>
                </li>
            </ol>
        </nav>
        <h1 class="app-page-header__title" th:text="${title}">Title</h1>
    </hgroup>
</header>

<!-- Empty / loading / error state: one consistent treatment, never a blank screen. -->
<!--/* The console header, and the only one: every screen and every edition renders this, so moving between
     screens - or from one edition to the other - changes the page under it and nothing around it.

     The brand is a parameter because that is edition identity rather than a difference to erase, and `extras` is a
     slot for the items an edition has and the other does not (a licence badge belongs to whoever has licensing, and
     naming it here would put one edition's vocabulary in the other's shell). Pass `~{}` when there are none.

     Everything else is model-driven and null-safe: a console that publishes no tenant, no posture badge and no
     signed-in user renders none of those, so the same markup serves a single-tenant console and a multi-tenant one
     without asking which it is. */-->
<th:block th:fragment="shell(brandName, brandHref, brandLogo, extras)">
    <a class="app-skip-link" href="#main">Skip to content</a>
    <nav class="container app-nav" aria-label="Primary">
        <ul>
            <li th:insert="~{base :: brand(${brandName}, ${brandHref}, ${brandLogo})}"></li>
        </ul>
        <ul>
            <th:block th:insert="~{base :: navLinks(${navEntries}, ${adminNav})}"></th:block>
            <li th:if="${tenant != null and showTenant}">
                <small>Tenant <strong th:text="${tenant}">default</strong></small></li>
            <li th:if="${postureBadge != null and postureBadge.visible()}">
                <a th:href="@{/posture}" class="secondary"
                   th:title="${postureBadge.title()}" th:text="${postureBadge.label()}">posture</a></li>
            <th:block th:replace="${extras}"></th:block>
            <li th:if="${currentUser}"><small>Signed in as <span th:text="${currentUser}">user</span></small></li>
            <li><select th:replace="~{base :: themeSelect}"></select></li>
            <li th:if="${currentUser}">
                <form method="post" th:action="@{/logout}" style="display:inline; margin:0">
                    <button class="secondary outline" type="submit">Sign out</button>
                </form>
            </li>
        </ul>
    </nav>
</th:block>

<!--/* The links every installed console module contributes, rendered identically wherever the console runs.
     Two sections rather than one flat bar: a deployment with several modules installed puts the three or four
     links that get daily use somewhere in the middle of the settings-shaped ones, and someone who visits
     occasionally has to re-read the whole bar every time. The administration group is a plain <details>
     dropdown - Pico styles it, it needs no script, and a native disclosure is keyboard- and screen-reader-
     operable without a line of ARIA. Nothing is hidden; it is one keystroke away and grouped by what it is.

     Both lists are null-safe: an error page renders this shell outside the controller advice, so every model
     attribute is absent there. th:each tolerates a null quietly; an expression asking a list its size does not. */-->
<th:block th:fragment="navLinks(navEntries, adminNav)">
    <li th:each="entry : ${navEntries}" th:if="${entry.section.name() == 'PRIMARY'}">
        <a th:href="${entry.path}" th:text="${entry.label}">Nav</a></li>
    <li th:if="${adminNav != null and !adminNav.isEmpty()}">
        <details class="dropdown app-nav-group">
            <summary>Administration</summary>
            <ul dir="rtl">
                <li th:each="entry : ${adminNav}">
                    <a th:href="${entry.path}" th:text="${entry.label}">Nav</a></li>
            </ul>
        </details>
    </li>
</th:block>

<div th:fragment="empty(message)" class="app-empty" role="status">
    <div class="app-empty__icon" aria-hidden="true">∅</div>
    <p th:text="${message}" style="margin:0">Nothing here yet.</p>
</div>

<!-- There is no badge fragment. A status pill is the `.app-badge` class plus one of `--pass`, `--warn`,
     `--danger`, `--info` or `--muted`, written directly - which is what all sixty-nine of them already did, while
     the two-argument fragment that used to sit here was rendered by nothing at all. It could not have served them
     anyway: a badge routinely carries a `th:if`, a `title`, or composed content, none of which a fixed pair of
     parameters expresses. What actually needed to be shared was the appearance, and that lives in app.css, where
     the kind now carries its own icon - so two badges meaning the same thing look the same without any template
     naming one. A fragment nobody renders, documented as though they did, is worse than no fragment. -->

<!-- Form field with inline help: label, control, help text — the atom the config page composes from. -->
<div th:fragment="field(label, name, value, help)" class="app-field">
    <label th:for="${name}" th:text="${label}">Label</label>
    <input type="text" th:id="${name}" th:name="${name}" th:value="${value}"
           th:attr="aria-describedby=${name} + '-help'">
    <small class="app-field__help" th:id="${name} + '-help'" th:text="${help}">Help text.</small>
</div>

<!-- Alert / flash message: the one outcome-banner treatment. An error is role=alert so assistive technology
     announces it; anything else is a polite status. The text always carries the meaning, never colour alone. -->
<p th:fragment="alert(message, kind)" class="app-alert"
   th:classappend="${kind} != null ? 'app-alert--' + ${kind} : ''"
   th:attr="role=${kind == 'danger'} ? 'alert' : 'status'" th:text="${message}">message</p>

<!-- Destructive submit button: the danger treatment and the confirmation in one place.

     Both halves exist because either alone is insufficient. Styling without a prompt still lets one click destroy
     something; a prompt without styling gives no warning until after the click, and a dialog that appears
     unexpectedly is dismissed reflexively. Bundling them means a screen cannot add the button and forget the
     guard - the only way to render a destructive control is to say what it will do.

     `confirm` is the question, and it should name the consequence rather than the verb: "Discard this artifact?
     It cannot be recovered." tells the reader what they lose, where "Are you sure?" tells them nothing they did
     not already know. -->
<button th:fragment="dangerButton(label, confirm)" type="submit" class="secondary outline app-danger"
        th:attr="data-confirm=${confirm}" th:text="${label}">delete</button>

<!-- Theme switch: a compact labelled select the shell nav carries. /js/theme.js (loaded by the head fragment)
     applies the stored choice before first paint and wires every [data-theme-select]; "auto" follows the OS. -->
<select th:fragment="themeSelect" class="app-theme-select" data-theme-select aria-label="Color theme">
    <option value="auto">Auto</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
</select>

</body>
</html>

<!--/* Deployment-wide notices, on the shared alert treatment: announced as status/alert and tinted from the status
     palette in both themes, never a hard-coded colour. th:if sits on a wrapping block because fragment inclusion
     (precedence 100) would otherwise run before the conditional (300). */-->
<div th:fragment="messages">
    <th:block th:if="${readOnly}"><p th:replace="~{base :: alert('This instance is in read-only mode - every write is refused.', 'warn')}"></p></th:block>
    <th:block th:if="${anonymousRights != null and !anonymousRights.isEmpty()}"><p th:replace="~{base :: alert('Anonymous access is enabled (' + ${anonymousRights} + ') - a request with no credential is served against that grant.', 'warn')}"></p></th:block>
    <th:block th:if="${message}"><p th:replace="~{base :: alert(${message}, null)}"></p></th:block>
    <th:block th:if="${error}"><p th:replace="~{base :: alert(${error}, 'danger')}"></p></th:block>
</div>

<!--/* The scoped-error panel for ONE subsection of a page. When a subsection's data could not be derived or parsed -
     which is not the same as genuinely empty - the caller renders this in that subsection's place while every
     sibling and the rest of the page render normally: a failure in one panel must never 500 or blank the whole
     view. One reusable wrapper on the shared alert treatment, so the error state is uniform rather than a bespoke
     per-panel hack. */-->
<article th:fragment="subsectionError(title, message, detail)" class="app-subsection-error" aria-live="polite">
    <h2 th:text="${title}">Subsection</h2>
    <p th:replace="~{base :: alert(${message}, 'warn')}">could not derive this subsection</p>
    <p th:if="${detail}"><small th:text="${detail}">cause</small></p>
</article>
