spring.application.name=jenesis-repository-console

# The framework's ASCII banner adds six lines to the top of every start-up log and says nothing about
# this deployment. Set here rather than on the launcher so it holds for every boot of this node - the
# packaged entrypoint, the embedded start(int) a harness uses, and any composition that loads this file.
spring.main.banner-mode=off

server.port=${PORT:8081}

# An HTTPS-terminating ingress fronts the app over forwarded headers, so honour them when building OAuth
# redirect URIs and absolute links.
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info,metrics
# Restated rather than imported, and this is the only place that is true. The shared posture lives in the free
# core's server module (actuator-posture.properties) and every node that serves artifacts imports it; this is the
# console's own development launcher, whose graph has no server module, so there is no resource to import. It is
# a dev entry point rather than a shipped node - the console a deployment runs is the merged one, which imports.
management.endpoint.health.probes.enabled=true
# The paths a container platform probes are open - a kubelet carries no credential, and a probe that needs one
# is a probe that fails the pod - so they answer a summarized state and nothing else. The group defaults would
# already do that; a guarantee resting on a framework default is one nobody here decided, so it is pinned.
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.liveness.show-components=never
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
# The open summary at /actuator/health is a status too. It used to be when-authorized, which read as protection
# and was not: the key filter lifts ANY non-blank key into the security context without validating it, so
# "authorized" there meant "sent a header". The gate is the security chain, and the chain does not gate this
# path - so the value has to be never.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# There is deliberately no health group carrying the breakdown here. On the nodes that serve artifacts one
# exists (/actuator/health/full) because their chain gates everything under /actuator that is not a probe path;
# this node's chain claims a narrower space and leaves /actuator matched by nothing, so a group would be a
# breakdown published to the port rather than one held behind a key. An operator who wants it sets
# MANAGEMENT_SERVER_PORT and keeps that port off the public service.

# Session cookie hardening. Secure defaults to true (the secure default, matching the downstream console) so the
# session cookie is only ever sent over HTTPS and cannot leak over plain HTTP. A plain-HTTP local run where the
# cookie must survive the OAuth redirect without TLS is an explicit opt-out: set JENREG_UI_SECURE_COOKIE=false.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${JENREG_UI_SECURE_COOKIE:true}
server.servlet.session.cookie.same-site=lax

# The artifact store the console reads, selected the same way the repository server selects it (the same
# JENREG_STORE backend and JENREG_FILESYSTEM_ROOT / cloud settings point both at one store).
jenreg.ui.store=${JENREG_STORE:filesystem}
# Comma-separated provider-qualified admin ids (github/<id>, oidc/<sub>). Empty (the default) grants ADMIN to no
# one, so an unconfigured console denies writes; set * to make every authenticated user an admin (the open-console
# opt-out).
jenreg.ui.admins=${JENREG_UI_ADMINS:}

# GitHub OAuth app credentials. When the client id is blank, GitHub login is disabled.
jenreg.ui.github.client-id=${JENREG_UI_GITHUB_CLIENT_ID:}
jenreg.ui.github.client-secret=${JENREG_UI_GITHUB_CLIENT_SECRET:}

# A generic OpenID Connect provider (Google, Keycloak, Okta, Azure AD, Auth0, ...). Endpoints and the JWK set
# are discovered from the issuer URI at startup. When the issuer or client id is blank, OIDC login is disabled.
# JENREG_UI_OIDC_NAME labels the sign-in button. If neither GitHub nor OIDC is configured, sign-in is disabled
# and the app shows a "not configured" notice instead of failing (run the dev profile for local form login).
jenreg.ui.oidc.issuer-uri=${JENREG_UI_OIDC_ISSUER_URI:}
jenreg.ui.oidc.client-id=${JENREG_UI_OIDC_CLIENT_ID:}
jenreg.ui.oidc.client-secret=${JENREG_UI_OIDC_CLIENT_SECRET:}
jenreg.ui.oidc.name=${JENREG_UI_OIDC_NAME:Single sign-on}

# Templates and static assets live under META-INF (templates/, resources/) rather than the classpath root:
# META-INF is not a legal Java package name, so the module system derives no package from them and a
# downstream console module (the downstream UI) can `requires` this one and th:replace the base.html
# fragments without a split-package clash. Static URLs are unchanged - Spring Boot serves
# classpath:/META-INF/resources/ first by default; only the template prefix needs naming.
spring.thymeleaf.prefix=classpath:/META-INF/templates/
