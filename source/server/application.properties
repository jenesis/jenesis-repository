spring.application.name=jenesis-repository
server.port=${PORT:8080}

# The repository streams opaque artifact bodies of any size (jars, wheels, nupkgs, tarballs); do not let
# Spring parse or drain a request body as a web form before the format handler reads it. A multipart
# upload (twine to the PyPI format) and a form-encoded PUT would otherwise be consumed by the multipart
# resolver or FormContentFilter and reach the handler empty.
spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false
server.tomcat.max-swallow-size=-1

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# The paths a container platform probes are open - a kubelet carries no credential, and a probe that needs one
# is a probe that fails the pod - so they answer a summarized state and nothing else. The group defaults would
# already do that; a guarantee resting on a framework default is one nobody here decided, so it is pinned.
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.liveness.show-components=never
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
# The open summary at /actuator/health is a status too. It used to be when-authorized, which read as protection
# and was not: the key filter lifts ANY non-blank key into the security context without validating it, so
# "authorized" there meant "sent a header". The gate is the security chain, and the chain does not gate this
# path - so the value has to be never.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Where the breakdown lives instead. A group holding every contributor, on a path the chain does NOT permit, so
# it falls through to the authorization manager and needs a wildcard-granted key like the rest of /actuator.
management.endpoint.health.group.full.include=*
management.endpoint.health.group.full.show-details=always
management.endpoint.health.group.full.show-components=always
jenreg.store=${JENREG_STORE:filesystem}
# Per-credential authorization is enforced by default (the secure default). Running anonymous/open is an explicit
# opt-out: set JENREG_AUTH=false, and the server logs a loud boot warning that it is running open.
jenreg.auth=${JENREG_AUTH:true}
