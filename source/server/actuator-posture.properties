# The actuator health posture every node in this product shares, stated here so that it is stated once.
#
# It used to be copied into seven configuration files. That is how the value drifted: one of them said
# show-details=always and served every contributor's detail to anyone who could reach the port, while its own
# image said when-authorized, so what a deployment disclosed depended on which node it ran. A security posture
# restated in seven places is a posture nobody owns.
#
# What it says: the paths a container platform probes are open - a kubelet carries no credential, and a probe
# that needs one is a probe that fails the pod - so they answer a summarized state and nothing else. Spring's
# own defaults would already do that; a guarantee resting on a framework default is one nobody here decided,
# so the value is pinned.
#
# The open summary at /actuator/health is a status too, and the reason it cannot be when-authorized is worth
# keeping: KeyAuthenticationFilter lifts ANY non-blank key into the security context without validating it, so
# on a permit-all path "authorized" means "sent a header". The gate is the security chain, and the chain does
# not gate this path.
#
# Imported with spring.config.import, so an importing file still outranks it and a deployment that means to
# open something up writes that decision in its own file rather than editing this one.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.liveness.show-components=never
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
