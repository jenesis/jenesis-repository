# The health breakdown, on a path that is gated.
#
# A group holding every contributor, with details and components shown. /actuator/health/full is not one of the
# three paths RepositorySecurityAutoConfiguration permits, so it falls through to the authorization manager,
# which binds the /actuator subtree to a wildcard grant - the same floor as /actuator/prometheus and
# /actuator/metrics. That is what makes "always" safe here and unsafe on the summary.
#
# Imported ONLY by a node whose chain is unmatched-scope, and therefore actually covers /actuator. A node whose
# chain claims a narrower space - the console alone, the cache alone - leaves /actuator matched by no chain at
# all, so importing this there would publish the breakdown rather than hold it behind a key.
management.endpoint.health.group.full.include=*
management.endpoint.health.group.full.show-details=always
management.endpoint.health.group.full.show-components=always
