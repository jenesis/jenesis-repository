spring.application.name=jenesis-repository-cache

# The framework's ASCII banner adds six lines to the top of every start-up log and says nothing about
# this deployment. Set here rather than on the launcher so it holds for every boot of this node - the
# packaged entrypoint, the embedded start(int) a harness uses, and any composition that loads this file.
spring.main.banner-mode=off


# Loaded as cache.properties (CacheServer sets spring.config.name=cache), not application.properties, so
# the credential store's artifact-repository module - which ships its own application.properties - cannot
# shadow this one on the module path. That module also drags Spring Security onto the classpath, but the
# standalone cache server does its own per-request key auth and must not have a default deny-all/Basic
# chain in front of it, so the servlet security auto-configuration is switched off here. The combined
# single-node app loads combined.properties instead and keeps its console security chain (the cache routes
# are carved out as permit-all by CombinedSecurityConfig).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration

# Handle each blocking cache request (file/object-store I/O) on a virtual thread.
spring.threads.virtual.enabled=true

# The cache streams opaque blobs of arbitrary size; do not cap, parse, or drain the request body.
spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=-1
# Never treat a PUT body as a web form (FormContentFilter would drain the stream before the handler).
spring.mvc.formcontent.filter.enabled=false

# The store, the cache dials and the object-store backends are NOT listed here, and that is the point.
# This file used to declare some forty of them as jenreg.x=${JENREG_X:default} - which set each key to the
# value its own code already defaults to, and named the environment variable Spring would have read anyway.
# A property is reached from JENREG_X by relaxed binding whether or not a file mentions it, so every one of
# those lines restated the framework's own convention and added a place for the two to disagree. They did:
# a placeholder's raw text was once reported as a key's effective value, and ${JENREG_AUTH:true} read as
# false. Set jenreg.store, jenreg.filesystem.root, any jenreg.cache.* dial or any jenreg.s3.* /
# jenreg.azure-blob.* key from the environment or a -D and it applies; the defaults live with the code that
# reads them (CacheProperties, and each store provider), which is the only place they cannot drift from.

# The Azure container name went with them. This file used to pin it to jenesis-cache, from when the cache was a
# node with storage of its own - and because the image loads this file too, a repository on azure-blob
# then stored its artifacts in a container named after the build cache. The provider's own default,
# jenesis-repository, applies now; a deployment already on Azure names its existing container itself.

# Observability via Actuator. Health (with Kubernetes liveness/readiness probe groups) and the cache's
# Prometheus metrics are exposed as Actuator endpoints, following Spring Boot conventions on the main
# port by default. Set MANAGEMENT_SERVER_PORT to move them to a dedicated management port - kept off
# the public service/ingress in Kubernetes - which Spring Boot binds through relaxed env binding.
management.endpoints.web.exposure.include=health,prometheus
# The health posture is stated once in the server module and imported here; an imported document is
# lower precedence than this file, so anything below still wins.
spring.config.import=classpath:/actuator-posture.properties
# There is deliberately no health group carrying the breakdown here. On the nodes that serve artifacts one
# exists (/actuator/health/full) because their chain gates everything under /actuator that is not a probe path;
# this node's chain claims a narrower space and leaves /actuator matched by nothing, so a group would be a
# breakdown published to the port rather than one held behind a key. An operator who wants it sets
# MANAGEMENT_SERVER_PORT and keeps that port off the public service.
