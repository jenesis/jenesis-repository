# Dev-profile overrides (active only under SPRING_PROFILES_ACTIVE=dev). Loaded as ui-dev.properties, the
# profile document of ui.properties (Application sets spring.config.name=ui).
#
# The dev security chain (DevSecurityConfig) enables an in-memory root/root super-admin backdoor for local
# exploration, so a dev boot must never be reachable off the machine. Bind loopback by default; DevLoopbackGuard
# fails the boot fast if this is overridden to a non-loopback (routable) address, so the backdoor cannot be
# exposed to a network by running the dev profile where the production (!dev) chain belongs.
server.address=127.0.0.1

# A dev boot is plain http on loopback, and the session cookie has to survive the OAuth redirect without TLS - so
# the one place the secure flag comes off is here, in the profile that already means "this is not a deployment".
# It used to be an environment variable an operator could set anywhere (JENREG_UI_SECURE_COOKIE); a switch that
# turns session hardening off in production is not one worth documenting, and everything that genuinely needed it
# off - three test harnesses - was already passing Spring's own property on the command line.
server.servlet.session.cookie.secure=false
