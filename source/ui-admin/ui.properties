spring.application.name=jenesis-ui

# The framework's ASCII banner adds six lines to the top of every start-up log and says nothing about
# this deployment. Set here rather than on the launcher so it holds for every boot of this node - the
# packaged entrypoint, the embedded start(int) a harness uses, and any composition that loads this file.
spring.main.banner-mode=off


# Loaded as ui.properties (Application sets spring.config.name=ui), not application.properties, so no dependency's
# own root application.properties can shadow this app's configuration - the same guard repository.properties,
# cache.properties and combined.properties carry. This module requires build.jenesis.repository.server and
# build.jenesis.repository.ui, and BOTH of those jars ship a root application.properties; named as
# application.properties this file competed with them for the one classpath:/application.properties Spring loads,
# and lost, in a module-path-order-dependent way. What that cost: the app name (every console boot logged itself as
# "jenesis-repository"), the forwarded-header strategy and the whole session-cookie hardening block below. In their
# place the repository server's servlet settings applied - including the multipart switch. Had the other candidate
# won instead, the free console jar's spring.thymeleaf.prefix=classpath:/META-INF/templates/ would have applied and
# no page here would render at all.
#
# It also cost every setting whose environment variable was named differently from its key, since only an exact
# relaxed match survives with no file loaded. That whole class is gone now rather than fixed: a key that had to be
# declared for an environment variable to reach it was a key named differently from the variable, and each of those
# turned out to be a second property that had to equal a first one. jenreg.ui.store now reads jenreg.store like the
# rest of the deployment, jenreg.ui.root was read by nothing, and the reclaim targets take their own
# JENREG_UI_MIN_FREE_* rather than the build cache's.

# Azure Container Apps (and any HTTPS-terminating ingress) front the app over forwarded headers,
# so honour them when building OAuth redirect URIs and absolute links.
server.forward-headers-strategy=framework

# Actuator: /actuator/health (with liveness/readiness probe groups) is the container probe endpoint,
# metrics feed the observability backend. The probe paths say a status; the breakdown is on /actuator/health/full,
# which the console chain does not permit and so is reached only by an authenticated admin.
management.endpoints.web.exposure.include=health,info,metrics
# The health posture is stated once in the free core's server module and imported here; an imported document is
# lower precedence than this file, so anything below still wins.
spring.config.import=classpath:/actuator-posture.properties
# There is deliberately no health group carrying the breakdown here. On the nodes that serve artifacts one
# exists (/actuator/health/full) because their chain gates everything under /actuator that is not a probe path;
# this node's chain claims a narrower space and leaves /actuator matched by nothing, so a group would be a
# breakdown published to the port rather than one held behind a key. An operator who wants it sets
# MANAGEMENT_SERVER_PORT and keeps that port off the public service.

# Session cookie hardening: the session cookie is only ever sent over HTTPS. There is no operator switch for
# this - a deployment has no reason to want it off. A plain-HTTP local run turns it off by being a dev run
# (SPRING_PROFILES_ACTIVE=dev, which loads ui-dev.properties).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# The session travels in its cookie and never in a URL: a link Jetty rewrites with ;jsessionid on a new session is
# refused by the security firewall, so the first page of a session would load without its stylesheets and scripts.
server.servlet.session.tracking-modes=cookie

# Storage backend. One store per deployment, selected by JENREG_STORE and configured by
# JENREG_FILESYSTEM_ROOT / JENREG_S3_* / JENREG_AZURE_BLOB_* - none of which is declared here, because relaxed
# binding reaches a property from its own variable whether or not a file mentions it. The console reads
# jenreg.store, the same key the repository does, so JENREG_STORE selects the backend for both; there is no
# jenreg.ui.store to disagree with it any more. The build cache delegates into a segment of that store rather than
# carrying a backend of its own.
#
# The Azure container name is not pinned here either. This file used to set it to jenesis-cache, from when the
# cache was a node with storage of its own; the provider's own default, jenesis-repository, applies now.

# Spring's multipart resolver is off here exactly as it is in the repository server, the cache and the combined app.
# It exists to stop the resolver - and FormContentFilter - draining an opaque artifact upload body before the
# format handler reads it; twine's PyPI upload and `dotnet nuget push` are both multipart/form-data, so the switch
# protects the publish path and cannot be flipped per-app. The console's settings-import screens are the only
# multipart forms in the product, and SettingsController now reads their body with the product's own shared, bounded,
# streaming multipart reader (build.jenesis.repository.multipart, the reader the two publish paths walk) - so the
# switch stays global, one mechanism parses every multipart body, and the import works in every image including the
# combined one, where it was broken. It must stay false: with the resolver ON, Spring eagerly parses (drains) the
# body before the controller runs and the console's own read would find nothing.
spring.servlet.multipart.enabled=false

# GitHub OAuth app credentials. When the client id is blank, GitHub login is disabled.

# A generic OpenID Connect provider (Google, Keycloak, Okta, Azure AD, Auth0, ...). Endpoints and the
# JWK set are discovered from the issuer URI at startup. When the issuer or client id is blank, OIDC
# login is disabled. JENREG_UI_OIDC_NAME labels the sign-in button. If neither GitHub nor OIDC is
# configured, sign-in is disabled and the app shows a "not configured" notice instead of failing.
