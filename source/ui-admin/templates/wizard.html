<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${wizard.title()})}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <header th:replace="~{base :: pageHeader(${wizard.title()})}"></header>

    <!--/* The one wizard page: every wizard - the first boot's setup, a new repository, a new project - renders here from
         a WizardFlow. Nothing is written until the review's completion: every value rides this form as a hidden field
         from step to step, so Back loses nothing and leaving the page leaves nothing behind. */-->
    <ol class="app-steps" aria-label="Steps">
        <li th:each="step, at : ${wizard.steps()}"
            th:attr="aria-current=${at.index == wizard.index()} ? 'step' : null"
            th:text="${step.title()}">Step</li>
    </ol>

    <form method="post" th:action="@{${wizard.action()}}" class="app-wizard"
          th:with="step=${wizard.current()}">
        <input type="hidden" name="step" th:value="${wizard.index()}">
        <input type="hidden" th:each="c : ${wizard.carried()}" th:name="${c.name()}" th:value="${c.value()}">

        <th:block th:unless="${wizard.errors().isEmpty()}">
            <p th:replace="~{base :: alert('A value on this step was refused; each says why beside it.', 'danger')}"></p>
        </th:block>

        <h2 th:text="|Step ${wizard.index() + 1} of ${wizard.steps().size()}: ${step.title()}|">Step 1 of 3</h2>
        <p th:each="paragraph : ${step.paragraphs()}" th:text="${paragraph}">Why this step is asked.</p>

        <!--/* The identity of what is created: its name and what else it is created as. */-->
        <div th:each="f : ${step.fields()}" class="app-field">
            <label th:for="${f.input()}" th:text="${f.label()}">Name</label>
            <select th:if="${!f.options().isEmpty()}" th:id="${f.input()}" th:name="${f.input()}"
                    th:attr="aria-describedby=|${f.input()}-help|,aria-invalid=${wizard.error(f.input()) != null} ? 'true' : null">
                <option th:each="o : ${f.options()}" th:value="${o}" th:text="${o}"
                        th:selected="${o == wizard.value(f.input())}">maven</option>
            </select>
            <input th:if="${f.options().isEmpty()}" type="text" th:id="${f.input()}" th:name="${f.input()}"
                   th:value="${wizard.value(f.input())}"
                   th:attr="aria-describedby=|${f.input()}-help|,aria-invalid=${wizard.error(f.input()) != null} ? 'true' : null">
            <small class="app-field__help" th:id="|${f.input()}-help|" th:text="${f.help()}">What the field is.</small>
            <small class="app-field__error" th:if="${wizard.error(f.input()) != null}" role="alert"
                   th:text="${wizard.error(f.input())}">Refused.</small>
        </div>

        <!--/* A settings step: each setting its level asks, left at its default to keep what it inherits. A setting this
             session may not set is shown with its value and who fixes it, and is not carried. A true/false setting is a
             switch (console.js turns its choice into one), muted while it is left at its default; every value is
             checked as soon as its field is left. */-->
        <div th:each="s : ${step.settings()}" class="setting"
             th:with="name=|setting.${s.key()}|, help=|setting.${s.key()}-help|">
            <div class="setting-head">
                <div class="setting-name">
                    <label th:for="${name}"><strong th:text="${s.label()}">Label</strong></label>
                </div>
            </div>
            <p class="setting-doc" th:id="${help}" th:text="${s.description()}">What this setting does.</p>
            <th:block th:if="${s.pinned()}">
                <p class="setting-values"><span>value: <strong th:text="${s.effectiveDisplay()}">value</strong></span>
                    <span th:text="|fixed by ${s.pinnedBy()}|">fixed by the operator</span></p>
            </th:block>
            <div class="setting-controls" th:unless="${s.pinned()}">
                <select th:if="${s.dropdown() or s.toggle()}" th:id="${name}" th:name="${name}"
                        th:attr="aria-describedby=${help},aria-invalid=${wizard.error(name) != null} ? 'true' : null,
                                data-switch=${s.toggle()} ? ${s.defaultValue()} : null,data-check-key=${s.key()}">
                    <option value="" th:text="|${s.defaultDisplay()} (default)|">Default</option>
                    <option th:each="o : ${s.options()}" th:unless="${o == s.defaultValue() and !s.toggle()}" th:value="${o}"
                            th:text="${s.optionLabel(o)}" th:selected="${o == wizard.value(name)}">option</option>
                </select>
                <textarea th:if="${s.textArea()}" th:id="${name}" th:name="${name}" th:rows="${s.json()} ? 8 : 4"
                          th:classappend="${s.json()} ? 'app-code'" th:text="${wizard.value(name)}"
                          th:placeholder="|${s.defaultDisplay()} (default)|"
                          th:attr="aria-describedby=${help},aria-invalid=${wizard.error(name) != null} ? 'true' : null,
                                  data-check-key=${s.key()}"></textarea>
                <input th:unless="${s.dropdown() or s.toggle() or s.textArea()}" th:id="${name}" th:name="${name}"
                       th:type="${s.inputType()}" th:value="${wizard.value(name)}"
                       th:placeholder="|${s.defaultDisplay()} (default)|"
                       th:attr="aria-describedby=${help},aria-invalid=${wizard.error(name) != null} ? 'true' : null,
                               data-check-key=${s.key()},
                               data-duration=${s.duration()} ? (${s.durationOrNone()} ? 'or-none' : 'duration') : null,
                               data-default=${s.duration()} ? ${s.defaultValue()} : null,
                               data-routing=${s.routing()} ? 'true' : null">
            </div>
            <small class="app-field__error" th:if="${wizard.error(name) != null}" role="alert"
                   th:text="${wizard.error(name)}">Refused.</small>
        </div>

        <!--/* A step that informs: what it says, and where the thing it talks about is done. */-->
        <p class="setting-values" th:unless="${step.links().isEmpty()}">
            <a th:each="l : ${step.links()}" th:href="@{${l.href()}}" th:text="${l.label()}">Open</a>
        </p>

        <!--/* The review: every choice the run makes, the defaults it leaves alone included. */-->
        <dl class="app-review" th:if="${wizard.reviewing()}">
            <th:block th:each="c : ${wizard.choices()}">
                <dt th:text="${c.label()}">Setting</dt>
                <dd><strong th:text="${c.value()}">value</strong>
                    <small th:if="${c.note() != null}" th:text="|(${c.note()})|">(default)</small></dd>
            </th:block>
        </dl>

        <!--/* The step's actions, by their weight: Next or the completion is the one primary, and the quicker completion
             the secondary beside it, both on the right where the run moves forward; going back and leaving change
             nothing, so they are quiet text on the left. Next comes first in the page, so Enter moves on; the
             stylesheet reverses the row. */-->
        <div class="app-wizard-actions">
            <button type="submit" name="action" value="complete" class="app-primary" th:if="${wizard.reviewing()}"
                    th:text="${wizard.completeLabel()}">Create</button>
            <button type="submit" name="action" value="next" class="app-primary" th:unless="${wizard.reviewing()}">Next</button>
            <button type="submit" name="action" value="now" class="secondary outline app-secondary"
                    th:if="${wizard.completesEarly()}" th:text="${wizard.nowLabel()}">Create now</button>
            <span class="app-wizard-actions__quiet">
                <button type="submit" name="action" value="back" class="app-quiet"
                        th:if="${wizard.index() > 0}">&larr; Back</button>
                <a th:unless="${wizard.exit().posts()}" th:href="@{${wizard.exit().href()}}"
                   th:text="${wizard.exit().label()}">Cancel</a>
                <button th:if="${wizard.exit().posts()}" type="submit" class="app-quiet"
                        th:formaction="@{${wizard.exit().href()}}" th:text="${wizard.exit().label()}">Skip for now</button>
            </span>
        </div>
    </form>
</main>
</body>
</html>
