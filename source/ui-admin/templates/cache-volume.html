<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cache volume')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <header th:replace="~{base :: pageHeader('Cache volume')}"></header>
    <!--/* The volume every tenant's projects share: a super-admin's, since what it reclaims crosses every tenant. */-->
    <p>
        <strong th:text="${@format.bytes(usableSpace)}">0 B</strong> free of
        <strong th:text="${@format.bytes(totalSpace)}">0 B</strong>.
        Configured target: <span th:text="${minFreeBytes}">0</span> bytes /
        <span th:text="${minFreePercent}">0</span>%.
    </p>
    <p><small>A reclaim runs a least-recently-used sweep across every project<th:block th:if="${multiTenant}"> of every
        tenant</th:block> until the target is
        met.</small></p>
    <p th:if="${reclaim.running()}"
       th:replace="~{base :: running('A reclaim is running; this screen refreshes when it lands.')}"></p>
    <p th:if="${reclaim.failure() != null}"
       th:replace="~{base :: alert(|The last reclaim stopped: ${reclaim.failure()}|, 'danger')}"></p>
    <p th:if="${reclaim.finishedAt() != null}"><small>The last reclaim finished
        <time th:replace="~{base :: time(${reclaim.finishedAt()})}">when</time>: deleted
        <span th:text="${reclaim.entriesDeleted()}">0</span> entries, freed
        <span th:text="${@format.bytes(reclaim.bytesFreed())}">0 B</span><th:block
                th:if="${reclaim.entriesDeleted() == 0}"> - the target was already met, or no threshold is
            set</th:block>.</small></p>
    <form method="post" th:action="@{/ui/projects/volume-reclaim}">
        <div class="grid">
            <label>Min free bytes <small>(blank = configured)</small>
                <input name="minFreeBytes" inputmode="numeric">
            </label>
            <label>Min free percent <small>(blank = configured)</small>
                <input name="minFreePercent" inputmode="numeric">
            </label>
        </div>
        <button th:unless="${reclaim.running()}"
                th:replace="~{base :: cautionButton('Reclaim now', 'Evict the least recently used cache entries across every project until the target is met?')}">Reclaim now</button>
    </form>
</main>
</body>
</html>
