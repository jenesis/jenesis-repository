<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Tenants')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <header th:replace="~{base :: pageHeader('Tenants')}"></header>
    <p><small>A tenant has its own repositories, projects, credentials and members, isolated from the others. Pick
        one to work in.</small></p>
    <div class="app-panels app-panels--lead">
    <article>
        <h2>Tenants</h2>
        <figure th:unless="${tenants.isEmpty()}">
            <table class="app-list">
                <thead>
                <tr>
                    <th scope="col">Tenant</th>
                    <th scope="col"><span class="app-sr-only">Open</span></th>
                    <th scope="col" th:if="${superadmin}"><span class="app-sr-only">Delete</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tenants}">
                    <td>
                        <code th:text="${t}">acme</code>
                        <small th:if="${t == selected}">- selected</small>
                    </td>
                    <td>
                        <form method="post" th:action="@{/ui/instances/select}" style="margin:0">
                            <input type="hidden" name="tenant" th:value="${t}">
                            <button type="submit">Open</button>
                        </form>
                    </td>
                    <td th:if="${superadmin}">
                        <form method="post" th:action="@{/ui/instances/delete}" style="margin:0">
                            <input type="hidden" name="name" th:value="${t}">
                            <button th:replace="~{base :: deleteButton('Delete', ${t}, 'The tenant is deleted with everything in it: every repository and artifact, every build-cache project, every credential and member, and its audit trail.')}">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </figure>
        <th:block th:if="${tenants.isEmpty()}">
            <div th:replace="~{base :: empty('No tenants yet.')}"></div>
        </th:block>
    </article>
    <article th:if="${superadmin}">
        <h2>New tenant</h2>
        <form method="post" th:action="@{/ui/instances/create}">
            <label>Name
                <input name="name" required pattern="[A-Za-z0-9_]+" placeholder="acme">
            </label>
            <button type="submit">Create tenant</button>
        </form>
    </article>
    </div>
</main>
</body>
</html>
