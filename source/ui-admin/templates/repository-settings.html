<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Settings')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <th:block th:replace="~{base :: repositoryHeader('Settings', 'of', null, null)}"></th:block>
    <p><small>What this repository is configured with - the settings the repository wizard asks when one is created,
        edited here.</small></p>
    <p th:unless="${isEditor}"><small>You have read-only access to this [[${scopeWord}]].</small></p>

    <th:block th:unless="${groups.isEmpty()}"><div th:replace="~{fragments :: settingFilter}"></div></th:block>
    <!--/* What the routing form offers as another repository to fall back on. */-->
    <datalist id="routing-repositories">
        <option th:each="name : ${routingRepositories}" th:value="${name}"></option>
    </datalist>
    <th:block th:if="${groups.isEmpty()}">
        <div th:replace="~{base :: empty('No module installed here declares a repository setting.')}"></div>
    </th:block>
    <th:block th:if="${isEditor}" th:each="g : ${groups}">
        <article th:replace="~{fragments :: settingGroup(${g}, '/ui/repositories/' + ${repo} + '/settings/save',
                '/ui/repositories/' + ${repo} + '/settings', 'inherited', 'the inherited value',
                ' for this repository')}"></article>
    </th:block>
    <th:block th:unless="${isEditor}" th:each="g : ${groups}">
        <article class="setting-group">
            <h2 th:text="${g.name}">Group</h2>
            <dl>
                <div th:each="s : ${g.settings}" class="setting"
                     th:attr="data-search=|${s.key} ${s.label} ${s.description} ${s.module}|">
                    <dt th:text="${s.label}">Label</dt>
                    <dd th:text="${s.effectiveDisplay()}">value</dd>
                </div>
            </dl>
        </article>
    </th:block>
</main>
</body>
</html>
