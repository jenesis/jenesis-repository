<!DOCTYPE html>
<!--
  browse.html — the generic artifact browse: a breadcrumbed, lazy tree over a repository's published namespace.

  Rendered by RepositoryAdminController against the repository inventory's prefix-listing seam. The tree body is
  `base :: browseRows`, shared with the whole-store browse the base console serves: the two drew the same tree in
  ninety lines of near-identical markup each, and had already drifted. What differs is where a row links, and a row
  carries its own links (BrowseRow). Every level lists only
  its immediate children; a folder's children are fetched on demand (the `rows` fragment, served by
  /repositories/{repo}/browse/children and swapped in by htmx on expand, or reached by navigating into the folder), so
  the browse never scans or buffers a whole tree. Folder-vs-artifact and the per-artifact size are supplied by the
  domain layer (RepositoryBrowse.browseTree). A substring coordinate search (RepositoryBrowse.search, over the
  precomputed release index) renders its hits through the same generic list/table as the tree - each hit links into
  the browse at the folder the coordinate occupies - so there is one list component behind both browse and search.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Browse')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <!--/* The browse's single navigation spine (UI.md §5): repositories list -> this repository's detail hub ->
         the browse root -> one crumb per path segment. It folds in the affordance that used to be a separate link
         back to the repository, so there is one trail rather than three overlapping "go up" controls. Rendered as
         the shared .app-page-header markup (crumbs above the title, docs/DESIGN.md §3) on the ol.app-breadcrumb. */-->
    <header class="app-page-header">
        <hgroup class="app-page-header__heading">
            <nav aria-label="Breadcrumb" th:unless="${searching}">
                <ol class="app-breadcrumb">
                    <li><a th:href="@{/ui/repositories}">Repositories</a></li>
                    <li><a th:href="@{/ui/repositories/{repo}(repo=${repo})}" th:text="${repo}">name</a></li>
                    <li>
                        <span th:if="${crumbs.isEmpty()}" aria-current="page">Browse</span>
                        <a th:unless="${crumbs.isEmpty()}"
                           th:href="@{/ui/repositories/{repo}/browse(repo=${repo},sort=${sort},dir=${dir})}">Browse</a>
                    </li>
                    <li th:each="c : ${crumbs}">
                        <span th:if="${c.current}" th:text="${c.label}" aria-current="page">segment</span>
                        <a th:unless="${c.current}"
                           th:href="@{/ui/repositories/{repo}/browse(repo=${repo},prefix=${c.prefix},sort=${sort},dir=${dir})}"
                           th:text="${c.label}">segment</a>
                    </li>
                </ol>
            </nav>
            <h1 class="app-page-header__title">Browse <span th:text="${repo}">name</span></h1>
        </hgroup>
    </header>

    <form method="get" th:action="@{/ui/repositories/{repo}/browse(repo=${repo})}">
        <div class="grid">
            <input name="q" type="search" th:value="${query}"
                   placeholder="search coordinates" aria-label="Search coordinates">
            <button type="submit">Search</button>
        </div>
    </form>

    <article th:if="${searching}">
        <p><a th:href="@{/ui/repositories/{repo}/browse(repo=${repo})}">&larr; back to browse</a></p>
        <h2>Matches for &ldquo;<span th:text="${query}">query</span>&rdquo;</h2>

        <!--/* Search hits are coordinates, not tree entries: a coordinate spans several files, so it has no single
             "type" or "size". The columns are labelled honestly (Name = coordinate:version linking to its browse
             folder; Ecosystem) rather than reusing the tree's Type/Size headers with an ecosystem in Type and a
             dead em-dash in Size. */-->
        <figure th:unless="${results.isEmpty()}">
        <table class="app-list">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Ecosystem</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${results}">
                <td class="app-list__name">
                    <!--/* The hit's ecosystem mark (W4.2b): the mark of the format that owns the coordinate, and a
                         DASHED orphan mark when no installed format declares the ecosystem it was published under -
                         the format module that served this content is gone, which the tile, the title and the
                         "not installed" note each say independently of colour. Inline so currentColor inverts with
                         the theme; the SVG is built from module constants and geometry, never from a name, so
                         th:utext is safe. A hit with no ecosystem at all draws the neutral mark. */-->
                    <span th:if="${r.mark != null}"
                          th:class="${r.mark.installed} ? 'format-icon' : 'format-icon format-icon--orphaned'"
                          th:title="${r.mark.title}" role="img" th:attr="aria-label=${r.mark.title}"
                          th:utext="${r.mark.svg}"></span>
                    <span th:if="${r.mark == null}" class="format-icon" title="no ecosystem recorded" role="img"
                          aria-label="no ecosystem recorded" th:utext="${neutralMark}"></span>
                    <a th:if="${!r.location.isEmpty()}"
                       th:href="@{/ui/repositories/{repo}/browse(repo=${repo},prefix=${r.location})}"
                       th:text="${r.coordinate} + ':' + ${r.version}">group:artifact:version</a>
                    <!--/* A hit with no folder in the tree is a blobs-namespace format's (npm, PyPI, NuGet ...), or
                         one whose format is gone; either way its coordinate has a screen of its own, which lists
                         every version and the paths each is served at. */-->
                    <a th:if="${r.location.isEmpty() and !r.ecosystem.isEmpty()}"
                       th:href="@{/ui/repositories/{repo}/coordinate(repo=${repo},ecosystem=${r.ecosystem},coordinate=${r.coordinate})}"
                       th:text="${r.coordinate} + ':' + ${r.version}">name:version</a>
                    <code th:if="${r.location.isEmpty() and r.ecosystem.isEmpty()}"
                          th:text="${r.coordinate} + ':' + ${r.version}">group:artifact:version</code>
                </td>
                <td>
                    <span th:text="${r.ecosystem}">ecosystem</span>
                    <!--/* Said in words as well as drawn: the artifacts are still stored and still listed, and what
                         is gone is the format module that placed them - which is why the row also has no link into
                         the tree. Never a reason to remove anything. */-->
                    <small th:if="${r.mark != null and !r.mark.installed}">&mdash; no installed format serves this ecosystem</small>
                </td>
            </tr>
            </tbody>
        </table>
        </figure>

        <!--/* The bound is visible (D-183): the search index and the no-index substring scan both answer a bounded
             window, so a clamped hit list says that more matches remain rather than reading as the whole set. */-->
        <p th:if="${truncated}"><small>Showing the first <span th:text="${results.size()}">1000</span> matches;
            more remain past this page. Narrow the query, or page the <code>/api/search</code> endpoint with its
            cursor, to reach the rest.</small></p>

        <th:block th:if="${results.isEmpty()}">
            <div th:replace="~{base :: empty('No coordinates match this search.')}"></div>
        </th:block>
    </article>

    <article th:unless="${searching}">
        <figure th:unless="${entries.isEmpty()}">
        <table class="app-list">
            <thead>
            <!--/* Sortable columns (W4.3b): each header re-requests this same level ordered by that column, toggling
                 direction when it is already the sort column. Size sorts on the raw byte count in the domain layer
                 (RepositoryBrowse.browseTree), so "9 B" sorts below "10 KB" rather than lexically; a folder's size is
                 its cached subtree roll-up. aria-sort marks the active column and the arrow shows its direction. */-->
            <tr>
                <th scope="col" th:attr="aria-sort=${sort == 'name' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}">
                    <a th:href="@{/ui/repositories/{repo}/browse(repo=${repo},prefix=${prefix},sort='name',dir=${sort == 'name' and dir == 'asc' ? 'desc' : 'asc'})}">Name</a>
                    <span th:if="${sort == 'name'}" aria-hidden="true" th:text="${dir == 'asc' ? '▲' : '▼'}">▲</span>
                </th>
                <th scope="col" th:attr="aria-sort=${sort == 'type' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}">
                    <a th:href="@{/ui/repositories/{repo}/browse(repo=${repo},prefix=${prefix},sort='type',dir=${sort == 'type' and dir == 'asc' ? 'desc' : 'asc'})}">Type</a>
                    <span th:if="${sort == 'type'}" aria-hidden="true" th:text="${dir == 'asc' ? '▲' : '▼'}">▲</span>
                </th>
                <th scope="col" th:attr="aria-sort=${sort == 'size' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}">
                    <a th:href="@{/ui/repositories/{repo}/browse(repo=${repo},prefix=${prefix},sort='size',dir=${sort == 'size' and dir == 'asc' ? 'desc' : 'asc'})}">Size</a>
                    <span th:if="${sort == 'size'}" aria-hidden="true" th:text="${dir == 'asc' ? '▲' : '▼'}">▲</span>
                </th>
            </tr>
            </thead>
            <tbody>
            <th:block th:if="${hasParent}">
                <tr th:replace="~{base :: browseUp(@{/ui/repositories/{repo}/browse(repo=${repo},prefix=${parent},sort=${sort},dir=${dir})})}"></tr>
            </th:block>
            <!--/* Named so htmx can fetch just this block for a folder's children; it delegates to the shared tree,
                 so the lazily injected rows and the page's own rows are the same rows. */-->
            <th:block th:fragment="rows">
                <th:block th:replace="~{base :: browseRows(${entries}, ${truncated},
                        'Showing the first ' + ${entries.size()} + ' entries of this folder; search by coordinate above to reach the rest.')}"></th:block>
            </th:block>
            </tbody>
        </table>
        </figure>

        <th:block th:if="${entries.isEmpty() and !hasParent}">
            <div th:replace="~{base :: empty('The repository is empty. Publish an artifact to see it here.')}"></div>
        </th:block>
        <th:block th:if="${entries.isEmpty() and hasParent}">
            <div th:replace="~{base :: empty('This folder is empty.')}"></div>
        </th:block>
    </article>
</main>
</body>
</html>
