<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Audit')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <header th:replace="~{base :: pageHeader('Audit trail')}"></header>
    <p><small>Security-relevant changes for this [[${scopeWord}]], newest first.
        <a th:href="@{/ui/admin/audit.csv(action=${action})}">Export CSV</a></small></p>
    <form method="get" th:action="@{/ui/admin/audit}">
        <div class="app-filter-bar">
            <label>Action <small>(exact, e.g. credential.mint)</small>
                <input name="action" th:value="${action}" placeholder="credential.mint">
            </label>
            <button th:replace="~{base :: secondaryButton('Filter')}">Filter</button>
        </div>
    </form>
    <figure th:unless="${events.isEmpty()}">
        <table class="app-list">
            <thead>
            <tr><th scope="col">When</th><th scope="col">Actor</th><th scope="col">Action</th>
                <th scope="col">Target</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${events}">
                <td th:text="${e.at}">2026-06-30T00:00:00Z</td>
                <td><code th:text="${e.actor}">hash</code></td>
                <td th:text="${e.action}">credential.mint</td>
                <td><code th:text="${e.target}">target</code></td>
            </tr>
            </tbody>
        </table>
    </figure>
    <th:block th:if="${events.isEmpty() and !more}">
        <div th:replace="~{base :: empty(${'No audit events recorded for this ' + scopeWord + ' yet.'})}"></div>
    </th:block>
    <!--/* A page short of its limit that has more stopped at the trail's bound on events read, so older events may
         still match; the bound is shown, never left to read as the end of the trail. */-->
    <th:block th:if="${events.isEmpty() and more}">
        <div th:replace="~{base :: empty('None of the events read for this page match. Older events may: More carries on where it stopped.')}"></div>
    </th:block>
    <p th:if="${more and !events.isEmpty() and events.size() < limit}"><small>This page stopped after reading as many
        events as one page may, so older events may still match: More carries on where it stopped.</small></p>
    <p th:replace="~{base :: pager(${more} ? @{/ui/admin/audit(action=${action},after=${next},limit=${limit})} : null,
            ${hasPrev} ? @{/ui/admin/audit(action=${action},limit=${limit})} : null)}"></p>
</main>
</body>
</html>
