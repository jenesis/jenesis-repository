<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Credentials')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <header th:replace="~{base :: pageHeader('Credentials')}"></header>
    <p><small>A credential is a hashed access key that grants repositories and build-cache projects by role. Open one
        to change what it grants, when it expires and where it may be used from<th:block th:if="${isEditor}">, or
        <a th:href="@{/ui/credentials/new}">create a new credential</a> - its key is shown once, when it is
        created</th:block>.</small></p>

    <!--/* The credentials across the whole width, as the repositories are, and a filter over the rows already rendered. */-->
    <th:block th:unless="${credentials.isEmpty()}">
        <label>
            <input type="search" id="credential-filter" autocomplete="off" data-filter=".credential-row"
                   data-filter-empty="credential-nomatch" aria-label="Filter credentials by label or id"
                   placeholder="Filter by label or id">
        </label>
        <p class="setting-nomatch" id="credential-nomatch" hidden>No credential matches that filter.</p>
    <figure th:unless="${credentials.isEmpty()}">
        <table class="app-list">
            <thead>
            <tr>
                <th scope="col">Label</th>
                <th scope="col">Id (sha-256)</th>
                <th scope="col">Grants</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${credentials}" class="credential-row"
                th:attr="data-search=${c.label + ' ' + c.id}">
                <td><a th:href="@{'/ui/credentials/' + ${c.id}}"
                       th:text="${#strings.isEmpty(c.label)} ? '(no label)' : ${c.label}">label</a></td>
                <td><code th:text="${c.shortId} + '&hellip;'">hash</code></td>
                <td>
                    <span th:if="${c.grants.isEmpty()}">- none -</span>
                    <span th:each="g, i : ${c.grants}"><span
                            th:text="${g.scope()} + '=' + ${g.role}">acme=read,write</span><span
                            th:if="${!i.last}">, </span></span>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${next != null or paged}"><small>
            <a th:if="${paged}" th:href="@{/ui/credentials}">&larr; first page</a>
            <a th:if="${next != null}" th:href="@{/ui/credentials(after=${next})}">more credentials &rarr;</a></small></p>
    </figure>
    </th:block>
    <th:block th:if="${credentials.isEmpty() and !paged and isEditor}">
        <div th:replace="~{base :: emptyAction('No credentials yet. ', 'Create one', '/ui/credentials/new',
                ' to publish or read with.')}"></div>
    </th:block>
    <th:block th:if="${credentials.isEmpty() and !paged and !isEditor}">
        <div th:replace="~{base :: empty('No credentials yet.')}"></div>
    </th:block>
</main>
</body>
</html>
