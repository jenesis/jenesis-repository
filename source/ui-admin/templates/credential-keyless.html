<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Keyless CI')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <header th:replace="~{base :: pageHeader('Keyless CI')}"></header>
    <p><small>A CI job exchanges the OIDC id-token its platform issues for a short-lived key at
        <code>POST /api/token</code> - no static secret to store. Each trust admits one issuer; a token whose
        audience and subject (glob) match is minted a key with the trust's grant for its lifetime.</small></p>
    <div class="app-panels app-panels--lead">
        <article>
            <h2>Trusted issuers</h2>
            <figure th:unless="${trusts.isEmpty()}">
                <table class="app-list">
                    <thead>
                    <tr><th scope="col">Name</th><th scope="col">Issuer</th><th scope="col">Subject</th><th scope="col">Grant</th><th scope="col"><span class="app-sr-only">Actions</span></th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${trusts}">
                        <td th:text="${t.name}">gh</td>
                        <td><code th:text="${t.issuer}">issuer</code></td>
                        <td><code th:text="${#strings.isEmpty(t.subject)} ? 'any' : ${t.subject}">sub</code></td>
                        <td><span th:text="${t.scope} + '=' + ${t.rights}">releases=repository:write</span></td>
                        <td class="app-list__actions">
                            <div class="app-actions">
                                <form method="post" th:action="@{'/ui/credentials/trusts/' + ${t.name} + '/remove'}">
                                    <button th:replace="~{base :: deleteButton('Remove', ${t.name}, 'The trust is removed; tokens from this issuer no longer exchange for a key.')}">Remove</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </figure>
            <th:block th:if="${trusts.isEmpty()}">
                <div th:replace="~{base :: empty('No OIDC trusts. Add one to let CI publish keylessly.')}"></div>
            </th:block>
        </article>
        <article>
            <h2>New trust</h2>
            <form method="post" th:action="@{/ui/credentials/trusts}">
                <label>Name <input name="name" required placeholder="github-main"></label>
                <label>Issuer <input name="issuer" required placeholder="https://token.actions.githubusercontent.com"></label>
                <label>Audience <small>(optional)</small><input name="audience" placeholder="jenesis"></label>
                <label>Subject glob <small>(optional)</small><input name="subject" placeholder="repo:acme/app:*"></label>
                <label>Scope <small>(a repository, a build-cache project, or <code>*</code>)</small>
                    <input name="scope" required placeholder="releases"></label>
                <label>Rights <input name="rights" required placeholder="repository:read,repository:write"></label>
                <label>Lifetime <input name="ttl" placeholder="PT15M" data-duration="duration" data-default="PT15M"></label>
                <button th:replace="~{base :: primaryButton('Save trust')}">Save trust</button>
            </form>
        </article>
    </div>
</main>
</body>
</html>
