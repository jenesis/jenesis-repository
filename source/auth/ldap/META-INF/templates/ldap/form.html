<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in with ' + ${directory})}"></head>
<body>
<main id="main" class="container">
    <article style="max-width: 32rem; margin: 4rem auto">
        <hgroup>
            <h1>jenesis</h1>
            <p th:text="'Sign in with ' + ${directory}">Sign in with your directory account</p>
        </hgroup>
        <th:block th:if="${param.error}">
            <p th:replace="~{base :: alert('Sign-in failed: the directory did not accept that name and password.', 'danger')}"></p>
        </th:block>
        <form method="post" th:action="@{/login/ldap}">
            <label for="username">Name</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required/>
            <button type="submit">Sign in</button>
        </form>
        <p><a th:href="@{/login}">&larr; Back to sign-in options</a></p>
    </article>
</main>
</body>
</html>
