<!doctype html>
<!--
  ldap/form.html - the directory sign-in form, drawn in the same frame as every other sign-in page.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Sign in with ' + ${directory}, ${product})}">
    <meta charset="utf-8">
    <title>Sign in</title>
</head>
<body>
<th:block th:replace="~{base :: signInShell}"></th:block>
<main id="main" class="app-signin">
    <h1>Sign in</h1>
    <p class="app-signin__lede" th:text="'With your ' + ${directory} + ' account.'">With your directory account.</p>
    <th:block th:if="${param.error}">
        <p th:replace="~{base :: alert('Sign-in failed: the directory did not accept that name and password.', 'danger')}"></p>
    </th:block>
    <form method="post" th:action="@{/login/ldap}">
        <label for="username">Name</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required/>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required/>
        <button type="submit">Sign in</button>
    </form>
    <p class="app-signin__foot"><a th:href="@{/login}">&larr; Back to sign-in options</a></p>
</main>
<footer th:replace="~{base :: footer}"></footer>
</body>
</html>
