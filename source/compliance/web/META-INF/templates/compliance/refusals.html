<!DOCTYPE html>
<!--
  refusals.html - what the gate refused outright in one repository, most recent first. A refusal stores nothing, so
  there is nothing to release or discard here: this is a record, not a queue, read from the durable quarantine ledger
  and never re-screened.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Refused')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <th:block th:replace="~{base :: repositoryHeader('Refused', 'in', null, null)}"></th:block>
    <p><small>Uploads and upstream bodies the gate refused outright, the latest <span th:text="${pageSize}">200</span>.
        A refusal stores nothing, so there is nothing to release or discard - unlike the quarantine queue, this is a
        record, not a queue.</small></p>
    <figure th:unless="${refusals.isEmpty()}">
        <table class="app-list">
            <thead>
            <tr>
                <th scope="col">Version</th>
                <th scope="col">Refused for</th>
                <th scope="col">When</th>
            </tr>
            </thead>
            <tbody>
            <!--/* Two rows a refusal, as every listing of artifacts has them: the version and what it was refused for,
                 then its reasons and the path it arrived at. */-->
            <th:block th:each="f : ${refusals}">
            <tr class="app-list__lead">
                <td><th:block th:replace="~{base :: artifactLink(${f.coordinate}, ${f.placed()}
                        ? @{/ui/repositories/{repo}/coordinate(repo=${repo},ecosystem=${f.ecosystem},coordinate=${f.bareCoordinate})} : null)}"></th:block></td>
                <td><th:block th:each="rule : ${f.rules}"><span class="app-badge app-badge--danger"
                        th:text="${rule}">Deny list</span> </th:block><small th:if="${f.rules.isEmpty()}">not recorded</small></td>
                <td class="app-list__date"><small><time th:replace="~{base :: time(${f.when})}">when</time></small></td>
            </tr>
            <tr class="app-list__detail">
                <td colspan="3">
                    <ul class="app-reasons" aria-label="Reasons">
                        <li th:each="reason : ${f.reasons}"><small th:text="${reason}">reason</small></li>
                        <li><small><code th:text="${f.path}">/path/...</code></small></li>
                    </ul>
                </td>
            </tr>
            </th:block>
            </tbody>
        </table>
    </figure>
    <th:block th:if="${refusals.isEmpty()}">
        <div th:replace="~{base :: empty('Nothing refused.')}"></div>
    </th:block>
</main>
</body>
</html>
