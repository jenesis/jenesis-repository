<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* The hub's quarantine panel: a bounded page of what the gate is holding for review.

     Fetched by the repository hub through htmx rather than rendered into it: the hub asks for this
     panel only when this module is installed, and pays for it only then. Before this the hub computed it on
     every render, installed or not - a cost that grew with what the feature held, on the first screen of a
     repository. */-->
<body>
<th:block th:fragment="panel">
    <article id="quarantine">
        <details class="app-section" th:attr="open=${quarantine.isEmpty()} ? null : 'open'">
            <summary><h2>Quarantine</h2></summary>
            <p><small>Artifacts the compliance gate held back, on the publish or the proxy-fetch path. Review the
                verdict and reasons, then release into the layout or discard.</small></p>
            <figure th:unless="${quarantine.isEmpty()}">
                <table class="app-list">
                    <thead>
                    <tr>
                        <th scope="col">Coordinate</th>
                        <th scope="col">Verdict</th>
                        <th scope="col">Held by</th>
                        <th scope="col">Reasons</th>
                        <th scope="col" th:if="${isEditor}"><span class="app-sr-only">Actions</span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="q : ${quarantine}">
                        <td>
                            <span th:text="${q.coordinate}">group:artifact:version</span><br>
                            <small><code th:text="${q.path}">/path/...</code></small>
                        </td>
                        <td><span class="app-badge app-badge--warn" th:text="${q.verdict}">QUARANTINE</span></td>
                        <!--/* D-095: the retroactive hold kinds standing on this coordinate, read from the durable
                               holds/ records rather than from the installed providers. A kind whose module has been
                               uninstalled still holds, and is drawn here exactly as an orphaned finding source is - the
                               same dashed tile and the same words - so an operator releasing it knows no installed module
                               can re-evaluate that hold. A plain publish-time gate hold writes no record and shows none. */-->
                        <td>
                            <th:block th:each="mark : ${q.holds}">
                                <span th:class="${mark.installed()} ? 'format-icon' : 'format-icon format-icon--orphaned'"
                                      th:title="${mark.title()}" role="img" th:attr="aria-label=${mark.title()}"
                                      th:utext="${mark.svg()}"></span><small th:text="${mark.name()}">kev</small><small
                                        th:unless="${mark.installed()}">&mdash; not installed</small><br>
                            </th:block>
                            <small th:if="${q.holds.isEmpty()}">&mdash;</small>
                        </td>
                        <td><small th:text="${#strings.listJoin(q.reasons, '; ')}">reason</small></td>
                        <td th:if="${isEditor}">
                            <form method="post" style="display:inline; margin:0"
                                  th:action="@{'/repositories/' + ${repo} + '/quarantine/release'}">
                                <input type="hidden" name="path" th:value="${q.path}">
                                <button type="submit">release</button>
                            </form>
                            <form method="post" style="display:inline; margin:0" class="app-actions__danger"
                                  th:action="@{'/repositories/' + ${repo} + '/quarantine/discard'}">
                                <input type="hidden" name="path" th:value="${q.path}">
                                <button th:replace="~{base :: dangerButton('discard', 'Discard this held artifact? Its bytes are dropped and it cannot be released afterwards.')}">discard</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </figure>
            <p th:if="${quarantineMore}"><small>Showing the first <span th:text="${hubWindow}">50</span> holds.
                <a th:href="@{/repositories/{repo}/quarantine(repo=${repo})}">Review the whole queue &rarr;</a></small></p>
            <th:block th:if="${quarantine.isEmpty()}">
                <div th:replace="~{base :: empty('Nothing in quarantine.')}"></div>
            </th:block>
        </details>
    </article>
</th:block>
</body>
</html>
