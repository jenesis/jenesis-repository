<!DOCTYPE html>
<!--
  quarantine.html - the review queue of one repository, one page at a time, paged by pointer key, so a backlog of any
  size is reviewed page by page and never rendered whole. Each page is enriched from the quarantine log and the durable hold records for its own rows only.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quarantine')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div th:replace="~{fragments :: messages}"></div>
    <th:block th:replace="~{base :: repositoryHeader('Quarantine', null, null)}"></th:block>

    <article>
        <p><small>What the compliance gate held back, on the publish or the proxy-fetch path, a version at a time:
            its files are released into the layout or discarded together, since one is no use without the others. In
            path order, <span th:text="${pageSize}">200</span> files a page.</small></p>
        <figure th:unless="${quarantine.isEmpty()}">
            <table class="app-list">
                <thead>
                <tr>
                    <th scope="col">Version</th>
                    <th scope="col">Verdict</th>
                    <th scope="col">Held by</th>
                    <th scope="col" th:if="${isEditor}"><span class="app-sr-only">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <!--/* Two rows a version: its facts and what may be done with it, then - across the table's whole width
                     - the reasons it is held for, one to a line, and its files, each with any reason of its own. */-->
                <th:block th:each="q : ${quarantine}">
                <tr class="app-list__lead">
                    <td>
                        <a th:if="${q.placed()}" th:href="@{/ui/repositories/{repo}/coordinate(repo=${repo},ecosystem=${q.ecosystem},coordinate=${q.bareCoordinate})}" th:text="${q.coordinate}">group:artifact:version</a>
                        <span th:unless="${q.placed()}" th:text="${q.coordinate}">group:artifact:version</span>
                    </td>
                    <td><span th:each="verdict : ${q.verdicts}" class="app-badge app-badge--warn"
                              th:text="${verdict}">QUARANTINE</span></td>
                    <!--/* The retroactive hold kinds standing on this coordinate, read from the durable
                           holds/ records rather than from the installed providers. A kind whose module has been
                           uninstalled still holds, and is drawn here exactly as an orphaned finding source is - the
                           same dashed tile and the same words - so an operator releasing it knows no installed module
                           can re-evaluate that hold. A hold the gate placed when the artifact arrived writes no record,
                           and says it is the gate's. */-->
                    <td>
                        <th:block th:each="mark : ${q.holds}">
                            <span th:class="${mark.installed()} ? 'format-icon' : 'format-icon format-icon--orphaned'"
                                  th:title="${mark.title()}" role="img" th:attr="aria-label=${mark.title()}"
                                  th:utext="${mark.svg()}"></span><small th:text="${mark.name()}">kev</small><small
                                    th:unless="${mark.installed()}">&mdash; not installed</small><br>
                        </th:block>
                        <small th:if="${q.holds.isEmpty()}"
                               title="Held by the screen the artifact met when it was published or fetched">the gate, on
                            arrival</small>
                    </td>
                    <td th:if="${isEditor}" class="app-list__actions">
                        <!--/* Release admits what the gate held and loses nothing, so it is the caution and asks,
                             naming the verdict and the reasons it overrides; discard drops the bytes for good, so it
                             is the danger, last, and asks for the name. Each acts on every file of the version. */-->
                        <div class="app-actions">
                            <form method="post" th:action="@{'/ui/repositories/' + ${repo} + '/quarantine/release'}"
                                  th:with="reasons=${#strings.listJoin(q.reasons, '; ')}">
                                <input type="hidden" name="coordinate" th:value="${q.coordinate}">
                                <input type="hidden" name="path" th:each="path : ${q.paths()}" th:value="${path}">
                                <button th:replace="~{base :: cautionButton('Release', |Serve ${q.coordinate} despite its ${#strings.listJoin(q.verdicts, ', ')} verdict? ${reasons}|)}">Release</button>
                            </form>
                            <form method="post" class="app-actions__danger"
                                  th:action="@{'/ui/repositories/' + ${repo} + '/quarantine/discard'}">
                                <input type="hidden" name="coordinate" th:value="${q.coordinate}">
                                <input type="hidden" name="path" th:each="path : ${q.paths()}" th:value="${path}">
                                <button th:replace="~{base :: deleteButton('Discard', ${q.coordinate}, |The bytes of the ${q.files.size()} held files are dropped, and they can no longer be released.|)}">Discard</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr class="app-list__detail">
                    <td th:colspan="${isEditor} ? 4 : 3">
                        <ul th:unless="${q.reasons.isEmpty()}" class="app-reasons" aria-label="Reasons">
                            <li th:each="reason : ${q.reasons}"><small th:text="${reason}">reason</small></li>
                        </ul>
                        <ul class="app-reasons" aria-label="Files">
                            <li th:each="file : ${q.files}"><small><code th:text="${file.path}">/path/...</code><th:block
                                    th:each="reason : ${file.reasons}"> &mdash; <span th:text="${reason}">reason</span></th:block></small></li>
                        </ul>
                    </td>
                </tr>
                </th:block>
                </tbody>
            </table>
        </figure>
        <p th:if="${next != null}"><small>
            <a th:href="@{/ui/repositories/{repo}/quarantine(repo=${repo},after=${next})}">Next page &rarr;</a></small></p>
        <th:block th:if="${quarantine.isEmpty()}">
            <div th:replace="~{base :: empty('Nothing in quarantine.')}"></div>
        </th:block>
    </article>
</main>
</body>
</html>
