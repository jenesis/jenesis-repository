spring.application.name=jenesis-repository

# The framework's ASCII banner adds six lines to the top of every start-up log and says nothing about
# this deployment. Set here rather than on the launcher so it holds for every boot of this node - the
# packaged entrypoint, the embedded start(int) a harness uses, and any composition that loads this file.
spring.main.banner-mode=off


# Loaded as repository.properties (spring.config.name=repository), not application.properties, so the free core
# dependency's own application.properties cannot shadow this app's management and servlet configuration on the path.

# The repository streams opaque artifact bodies of any size (jars, wheels, nupkgs, tarballs); do not let Spring parse
# or drain a request body as a web form before the format handler reads it. A multipart upload (twine to the PyPI
# format) and a form-encoded PUT would otherwise be consumed by the multipart resolver or FormContentFilter and reach
# the handler empty.
spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false
server.tomcat.max-swallow-size=-1

# Observability through Actuator and the Observation API. Health (with the Kubernetes liveness/readiness probe
# groups), metrics and the Prometheus scrape endpoint are exposed on the main port by default; set
# MANAGEMENT_SERVER_PORT to move them to a dedicated management port. A micrometer-registry-prometheus on the module
# path auto-configures the registry behind /actuator/prometheus; disable it with
# management.prometheus.metrics.export.enabled=false.
# observability is the distribution's custom endpoint (GET /actuator/observability): the seam's single collected
# report (health + metrics + task statuses, each self-describing) the console/CLI/API read. Like every non-health
# actuator surface it is authorization-gated by RepositoryAuthorizationManager as a deployment-management read
# (operator-tenant manage:read).
management.endpoints.web.exposure.include=health,info,metrics,prometheus,observability
# The health posture, and the gated group carrying the breakdown, are stated once in the free core's server
# module and imported here. An imported document is lower precedence than this file, so anything below still wins.
spring.config.import=classpath:/actuator-posture.properties,classpath:/actuator-breakdown.properties

# The per-contributor detail an operator needs (the WorkerHealthIndicator's enabled/alive/droppedEvents for the
# download, key-usage and cleanup workers) is on /actuator/health/full, behind a key, rather than on the open
# summary where it used to be - this file set show-details=always, which published it to the port.

# Distributed tracing is wired (the Micrometer Tracing OpenTelemetry bridge turns the same Observations into spans)
# but off by default, so a demo or test with no collector stays quiet. Enable with management.tracing.enabled=true
# and point management.opentelemetry.tracing.export.otlp.endpoint at an OTLP collector.
management.tracing.enabled=false

# Correlation ids on every log line: when the tracing bridge is on, Boot populates the MDC with the traceId/spanId,
# and this pattern surfaces them so a log line correlates with its span. Empty (no MDC) when tracing is off.
logging.pattern.correlation=[${spring.application.name:jenesis},%X{traceId:-},%X{spanId:-}]

# The storage backend is selected by ArtifactStoreProvider (ServiceLoader), filesystem by default.
# Per-credential authorization is enforced by default (the secure default). Running anonymous/open is an explicit
# opt-out: set JENREG_AUTH=false, and the server logs a loud boot warning that it is running open.
