# The node: the repository, the console and the build cache in one application, on one port. The port is not stated:
# 8080 is Spring's own default, and a file that repeats a default puts the value in a second place.
#
# The servlet settings below are the REPOSITORY's, and the console is written to survive them. Spring's
# MultipartResolver and FormContentFilter would drain an artifact upload body before the format handler read it -
# twine's PyPI upload and `dotnet nuget push` are both multipart/form-data - so both stay off. The console's
# settings-bundle import reads the request body with the product's own bounded streaming multipart reader for that
# reason, and carries its CSRF token in the form action because nothing parses the body before the filter chain runs.
spring.application.name=jenesis-repository

# The framework's ASCII banner adds six lines to the top of every start-up log and says nothing about
# this deployment. Set here rather than on the launcher so it holds for every boot of this node - the
# packaged entrypoint, the embedded start(int) a harness uses, and any composition that loads this file.
spring.main.banner-mode=off

spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false
server.tomcat.max-swallow-size=-1

# From the console: it renders behind a proxy and holds a session, neither of which the repository half minds.
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# The session travels in its cookie and never in a URL: a link Jetty rewrites with ;jsessionid on a new session is
# refused by the security firewall, so the first page of a session would load without its stylesheets and scripts.
server.servlet.session.tracking-modes=cookie

management.endpoints.web.exposure.include=health,info,metrics,prometheus
# The health posture, and the gated group carrying the breakdown, are stated once in the server
# module and imported here. An imported document is lower precedence than this file, so anything below still wins.
spring.config.import=classpath:/actuator-posture.properties,classpath:/actuator-breakdown.properties


# The console reads the same store the repository writes, so one deployment is one view.
