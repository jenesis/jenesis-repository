# The node: the repository and the console in one application, on one port.
#
# They were two launchers over two config files, selected by MAINCLASS. One application means one file, and the
# merge had exactly two conflicts worth recording: the application name, and the port - the console used to take
# 8081 beside the repository's 8080. The name is still pinned, at the top of this file. The port is not stated at
# all: 8080 is Spring's own default, and a file that repeats a default puts the value in a second place.
#
# The servlet settings below are the REPOSITORY's, and the console is written to survive them rather than the other
# way round. Spring's MultipartResolver and FormContentFilter would drain an artifact upload body before the format
# handler read it - twine's PyPI upload and `dotnet nuget push` are both multipart/form-data - so both stay off
# everywhere. The console's settings-bundle import reads the request body with the product's own bounded streaming
# multipart reader for that reason, and carries its CSRF token in the form action because nothing parses the body
# before the filter chain runs. This is not new: the console used to be simply broken wherever the switch was off,
# which was the combined single-node image.
spring.application.name=jenesis-repository

# The framework's ASCII banner adds six lines to the top of every start-up log and says nothing about
# this deployment. Set here rather than on the launcher so it holds for every boot of this node - the
# packaged entrypoint, the embedded start(int) a harness uses, and any composition that loads this file.
spring.main.banner-mode=off

spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false
server.tomcat.max-swallow-size=-1

# From the console: it renders behind a proxy and holds a session, neither of which the repository half minds.
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.prefix=classpath:/META-INF/templates/

management.endpoints.web.exposure.include=health,info,metrics,prometheus
# The health posture, and the gated group carrying the breakdown, are stated once in the free core's server
# module and imported here. An imported document is lower precedence than this file, so anything below still wins.
spring.config.import=classpath:/actuator-posture.properties,classpath:/actuator-breakdown.properties


# The console reads the same store the repository writes, so one deployment is one view.
