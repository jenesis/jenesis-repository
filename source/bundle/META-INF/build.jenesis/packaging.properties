bundle=true
# The base is named by digest, so a release rebuilt later is the same image; the images step refuses a tag alone.
# A JDK rather than a JRE image: com.nimbusds.jose.jwt requires jdk.crypto.ec, which the JRE image leaves out.
docker=eclipse-temurin:25-jdk@sha256:119a3d18f160a3e7655a66034d0f43beee31cd7b3b9142d57a5de29772011de6
# The image's own description. The build takes the title and description from this module's javadoc otherwise,
# which describes the module to its readers rather than the image to the people who pull it.
docker.label.org.opencontainers.image.title=Jenesis Repository
docker.label.org.opencontainers.image.description=A self-hosted artifact repository with no database, for more than twenty package ecosystems, that screens what comes in.
docker.label.org.opencontainers.image.documentation=https://jenesis.build/repository/
