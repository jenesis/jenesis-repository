# Dev-profile overrides (active only under SPRING_PROFILES_ACTIVE=dev). Loaded as bundle-dev.properties, the
# profile document of bundle.properties (Server sets spring.config.name=bundle).
# A dev boot is plain http on loopback, and the session cookie has to survive the OAuth redirect without TLS - so
# the one place the secure flag comes off is here, in the profile that already means "this is not a deployment".
# It used to be an environment variable an operator could set anywhere (JENREG_UI_SECURE_COOKIE); a switch that
# turns session hardening off in production is not one worth documenting, and everything that genuinely needed it
# off - three test harnesses - was already passing Spring's own property on the command line.
server.servlet.session.cookie.secure=false
