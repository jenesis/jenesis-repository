# The all-in-one node: the repository and the console in one application, on one port.
#
# They were two launchers over two config files, selected by MAINCLASS. One application means one file, and the
# merge had exactly two conflicts worth recording.
#
# server.port: the console used to take 8081 beside the repository's 8080. One node, one port.
#
# The servlet settings below are the REPOSITORY's, and the console is written to survive them rather than the other
# way round. Spring's MultipartResolver and FormContentFilter would drain an artifact upload body before the format
# handler read it - twine's PyPI upload and `dotnet nuget push` are both multipart/form-data - so both stay off
# everywhere. The console's settings-bundle import reads the request body with the product's own bounded streaming
# multipart reader for that reason, and carries its CSRF token in the form action because nothing parses the body
# before the filter chain runs. This is not new: the console used to be simply broken wherever the switch was off,
# which was the combined single-node image.
spring.application.name=jenesis-repository
server.port=${PORT:8080}
spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false
server.tomcat.max-swallow-size=-1

# From the console: it renders behind a proxy and holds a session, neither of which the repository half minds.
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${JENREG_UI_SECURE_COOKIE:true}
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.prefix=classpath:/META-INF/templates/

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

jenreg.store=${JENREG_STORE:filesystem}
jenreg.auth=${JENREG_AUTH:true}

# The console reads the same store the repository writes, so one deployment is one view.
jenreg.ui.store=${JENREG_STORE:filesystem}
jenreg.ui.admins=${JENREG_UI_ADMINS:}
jenreg.ui.github.client-id=${JENREG_UI_GITHUB_CLIENT_ID:}
jenreg.ui.github.client-secret=${JENREG_UI_GITHUB_CLIENT_SECRET:}
jenreg.ui.oidc.issuer-uri=${JENREG_UI_OIDC_ISSUER_URI:}
jenreg.ui.oidc.client-id=${JENREG_UI_OIDC_CLIENT_ID:}
jenreg.ui.oidc.client-secret=${JENREG_UI_OIDC_CLIENT_SECRET:}
jenreg.ui.oidc.name=${JENREG_UI_OIDC_NAME:Single sign-on}
