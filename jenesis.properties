jenesis.maven.uri=https://build.shibboleth.net/maven/releases/|org.opensaml|net.shibboleth,@
# The servers a declared signing key is fetched from, by fingerprint: the default (keyserver.ubuntu.com, which keeps
# every user id) first, then keys.openpgp.org, because at least one key this tree declares - WireMock's release bot -
# exists only there; it serves user ids only for a verified address, and gpgv refuses a key without any.
jenesis.openpgp.uri=@,https://keys.openpgp.org/
# The licence and its notice travel inside every jar this tree builds, where a copy that left the repository still
# says what it may be used for.
jenesis.project.resources=LICENSE:META-INF/LICENSE,NOTICE:META-INF/NOTICE
